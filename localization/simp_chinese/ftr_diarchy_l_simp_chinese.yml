l_simp_chinese:
 # ===== 交互（§2 / §4） =====
 ftr_diarchy_designate_heir_no_diarchy_tt:0 "<FTR>身旁坐着「共治型」共治者（共治皇帝 / 共治君主 / 太子 / 幼年君主）时不可立储——改立储君须先废立；摄政、宰相一类的官职线共治不拦立储"
 ftr_diarch_designate_heir_interaction:0 "<FTR>代君立储"
 ftr_diarch_designate_heir_interaction_desc:0 "<FTR>越过君主，直接为他指定继承人。你选中的储君将听命于你。"
 ftr_diarch_designate_heir_interaction_notification:0 "<FTR>已代君主立储"
 ftr_diarch_boost_succession_interaction:0 "<FTR>扶植继任共治"
 ftr_diarch_boost_succession_interaction_desc:0 "<FTR>为你自己的继承人铺路：一旦你离开共治之位，他将接替你成为共治者。"
 ftr_diarch_boost_succession_interaction_notification:0 "<FTR>继任共治者已安排妥当"
 ftr_diarch_boost_succession_effect_tt:0 "<FTR>你已为他铺好路：你一旦离开共治之位，他将接替你"
 ftr_diarch_levy_vassal_interaction:0 "<FTR>征调封臣入伍"
 ftr_diarch_levy_vassal_interaction_desc:0 "<FTR>以金钱、人情或影响力换取向君主封臣的效忠，令其加入你这一方的战争。"
 ftr_diarchy_levy_options_tt:0 "<FTR>你可以同时付出多种代价——给得越多，他越可能应允"
 ftr_diarchy_levy_gold_tt:0 "<FTR>黄金酬谢：#P +20#! 同意倾向"
 ftr_diarchy_levy_hook_tt:0 "<FTR>动用他的人情：#P +10#! 同意倾向"
 ftr_diarchy_levy_influence_tt:0 "<FTR>以行政影响力施压：#P +20#! 同意倾向"

 # ===== 决议（§3 / §4） =====
 ftr_diarchy_abolish_crown_prince_decision:0 "<FTR>废太子"
 ftr_diarchy_abolish_crown_prince_decision_desc:0 "<FTR>废除现任太子：剥夺其继承权、结束太子共治，并将其降为普通封臣。此举将招致太子与宫廷的深切怨恨。\n\n若你握有处罚他的正当理由——他犯有可拘押 / 可夺爵的实罪，或本人已在你手中——则此举是执行家法，正统性丝毫无损；若无正当理由，便是废长立幼，动摇国本。"
 ftr_diarchy_abolish_crown_prince_decision_tooltip:0 "<FTR>废黜太子，剥夺继承权"
 ftr_diarchy_abolish_prince_swing_tt:0 "<FTR>太子的[scales_of_power|E]不得超过 #P 60#!——趁其羽翼未丰，方可轻废"
 ftr_diarchy_abolish_prince_justified_tt:0 "<FTR>执行家法，而非废长立幼：#P 不损失正统性#!——太子犯有可拘押 / 可夺爵的实罪，或本人已在押"
 ftr_diarchy_abolish_prince_unjustified_tt:0 "<FTR>无正当理由而废储：#R 损失正统性 400#!——继承名分因此动摇，举国侧目"
 ftr_diarchy_abolish_backer_ask_tt:0 "<FTR>太子旧日的党羽将各得其讯：是继续守着这位废太子，还是与他一刀两断"
 ftr_diarchy_depose_liege_decision:0 "<FTR>废黜君主"
 ftr_diarchy_depose_liege_decision_desc:0 "<FTR>以权臣之势逼迫君主退位：他将失去所有头衔并被囚禁，由指定继承人继位，而你以定策之功隐于幕后。"
 ftr_diarchy_depose_liege_decision_tooltip:0 "<FTR>迫使君主退位，由继承人继位"
 ftr_diarchy_prepare_coup_decision:0 "<FTR>准备篡位"
 ftr_diarchy_prepare_coup_decision_desc:0 "<FTR>向君主的封臣摊牌：臣服于你，或举兵勤王。此举公开进行——君主会看到你的野心。"
 ftr_diarchy_prepare_coup_decision_tooltip:0 "<FTR>广播篡位意图，逼封臣表态"
 ftr_diarchy_prepare_coup_supporters_tt:0 "<FTR>至少需要 2 名有地封臣的背书"
 ftr_diarchy_coup_landing_decision:0 "<FTR>登临大位"
 ftr_diarchy_coup_landing_decision_desc:0 "<FTR>时机已至：罢黜君主、接管其全部头衔，并将他囚禁在你的掌控之下。"
 ftr_diarchy_coup_landing_decision_tooltip:0 "<FTR>夺取君主之位"
 ftr_diarchy_coup_landing_unlocked_tt:0 "<FTR>已无成规模的反对者，或局势已拖到摊牌之时"
 ftr_diarchy_amnesty_decision:0 "<FTR>大赦天下"
 ftr_diarchy_amnesty_decision_desc:0 "<FTR>以君主之名颁行大赦：赦免君主所有直属封臣的罪行、打开君主与你自己的牢门释放所有囚犯，并借此洗刷你作为共治者积累的不和之名。代价是君主的威望与不满。"
 ftr_diarchy_amnesty_decision_tooltip:0 "<FTR>削减自身不和、赦免主君直属封臣的罪行，并释放双方监狱中的全部囚犯"
 ftr_diarchy_amnesty_pardon_tt:0 "<FTR>君主的全部直属封臣：其罪行一律记为#P 已处罚#!（不可再据此监禁 / 流放 / 处决 / 剥夺头衔）"
 ftr_diarchy_amnesty_release_tt:0 "<FTR>狱门大开：君主与你的监狱中的#P 全部囚犯#!都将获释——他们会因你的恩德而感激"
 ftr_diarchy.0300.t:0 "<FTR>大赦之恩"
 ftr_diarchy.0300.desc:0 "<FTR>你重获自由，全因那位权倾朝野的共治者一纸大赦。他并不掩饰自己的期待：在他与君主的角力中，他希望站在他这一边。"
 ftr_diarchy.0300.a:0 "<FTR>为他背书（拥立之功）"
 ftr_diarchy.0300.b:0 "<FTR>婉言谢绝"
 ftr_diarchy.0400.t:0 "<FTR>废储之后：党羽的去路"
 ftr_diarchy.0400.desc:0 "<FTR>[ftr_diarchy_fallen_prince.GetTitledFirstName]被君上废去储位、夺了继承名分，退朝时那张座席已被撤下，余温散尽。昨日还替他说话的人，今日全都低着眼。你本也是他名下党羽之一——此刻，[ftr_diarchy_abolishing_liege.GetTitledFirstName]的人正在朝房外清点名单。"
 ftr_diarchy.0400.a:0 "<FTR>与他切割：退出太子党"
 ftr_diarchy.0400.b:0 "<FTR>守着他不走"
 ftr_diarchy_0400_exit_tt:0 "<FTR>解除背书：从太子名单除名、结清拥立之功。废太子会记住这一笔，但#P 主君将视你为可留之人#!"
 ftr_diarchy_0400_stay_tt:0 "<FTR>继续做他的党羽：废太子因此感激你，#R 主君会记住替废太子撑场的人#!"

 # ===== 事件（§4） =====
 ftr_diarchy.0010.t:0 "<FTR>权臣的野心"
 ftr_diarchy.0010.desc:0 "<FTR>你的共治者已开始公然串联朝臣，散布流言、许以官职。他不再掩饰自己的意图：他想要你的位子。"
 ftr_diarchy.0010.a:0 "<FTR>我记住了"
 ftr_diarchy.0020.t:0 "<FTR>摊牌：共治者的野心"
 ftr_diarchy.0020.desc:0 "<FTR>君主的共治者传来口信：他要求朝臣做出选择。屈从于他，还是以「清君侧」为名，为君主而战？"
 ftr_diarchy.0020.a:0 "<FTR>向他屈服（不反对）"
 ftr_diarchy.0020.b:0 "<FTR>以「清君侧」之名起兵"
 ftr_diarchy.0020.c:0 "<FTR>静观其变"
 ftr_diarchy.0100.t:0 "<FTR>废君的处置"
 ftr_diarchy.0100.desc:0 "<FTR>旧日的君主如今沦为阶下囚。他曾在高堂之上发号施令，如今他的性命握在你手里。"
 ftr_diarchy.0100.a:0 "<FTR>终身软禁"
 ftr_diarchy.0100.b:0 "<FTR>流放"
 ftr_diarchy.0100.c:0 "<FTR>处死"
 ftr_diarchy.0200.t:0 "<FTR>向君上索要封地"
 ftr_diarchy.0200.desc:0 "<FTR>你已是共治者，名下却依旧无地：没有自己的座席，没有可差遣的封臣，朝堂上你开口，回响总比旁人浅一分。你再一次向君上提起此事——一位共治者，理应拥有属于自己的领地。"
 ftr_diarchy.0200.a:0 "<FTR>开口索要一块封地（羽翼已丰，可强索）"
 ftr_diarchy.0200.a2:0 "<FTR>委婉奏请君上赐地"
 ftr_diarchy.0200.b:0 "<FTR>暂且不提"
 ftr_diarchy.0200.c:0 "<FTR>发誓忠心事主，此后再不提"
 ftr_diarchy_grant_land_rule_tt:0 "<FTR>划地规则：优先一块#EMP 非首都伯爵领#!；若无，则划出一个#EMP 公爵头衔#!（其下属伯爵领与封臣一并随封）。#P 世族头衔永不外授#!——家主之位不随封地转出。"
 ftr_diarchy_grant_request_tt:0 "<FTR>你羽翼未丰（[scales_of_power|E] 不足 #P 60#!），不能强索，只能#EMP 委婉奏请#!：请地表递到君上案前，由他裁断是否赐地。他若允准，你便有了一处领地与自己的封臣；他若推托，此事仍会再提。"
 ftr_diarchy_grant_land_liege_title:0 "<FTR>允其所请：共治者得封"
 ftr_diarchy_grant_land_liege_desc:0 "<FTR>你允了这份奏请，将 [ftr_diarchy_grant_title.GetName] 划与 [ftr_diarchy_grant_target.GetTitledFirstName]。他谢恩而退——此后他在朝堂上也有了自己的封臣与税赋。"
 ftr_diarchy_take_land_liege_title:0 "<FTR>共治者径直索地"
 ftr_diarchy_take_land_liege_desc:0 "<FTR>你的共治者没有递表，径直把 [ftr_diarchy_grant_title.GetName] 划到了自己名下。他羽翼已丰，这一纸你拦不住。"
 ftr_diarchy_grant_land_target_title:0 "<FTR>受封领地"
 ftr_diarchy_grant_land_target_desc:0 "<FTR>[ftr_diarchy_grant_liege.GetTitledFirstName] 名下的 [ftr_diarchy_grant_title.GetName] 如今归你所有——你终于有了自己的领地与封臣。"
 ftr_diarchy_grant_deny_tt:0 "<FTR>温言推托：他这一请落空，虽不致反目，却会记下这份失落"
 ftr_diarchy_land_denied_title:0 "<FTR>请地未允"
 ftr_diarchy_land_denied_desc:0 "<FTR>你委婉的奏请换来了委婉的推托——君上把请地表留中不发。你依旧是无地之身。"
 ftr_diarchy.0210.t:0 "<FTR>共治者的请地表"
 ftr_diarchy.0210.desc:0 "<FTR>[ftr_diarchy_petitioning_diarch.GetTitledFirstName]的奏表递到案前，措辞谦卑得近乎小心：他身为共治者却名下无地，无封臣可差、无座席可倚，故请君上「于域内择一处，付其掌管」。表末不敢催促，只添一句——愿为君上分忧。"
 ftr_diarchy.0210.a:0 "<FTR>允其所请：择一处划与掌管"
 ftr_diarchy.0210.b:0 "<FTR>温言推托：此事容后再议"

 # ===== 清君侧 CB（§5） =====
 ftr_qingjunce:0 "<FTR>清君侧"
 ftr_qingjunce_desc:0 "<FTR>以「清君侧」为名起兵：铲除盘踞君主身侧的共治者，取而代之辅政。"
 ftr_qingjunce_declared_tt:0 "<FTR>清君侧之兵已起"
 ftr_qingjunce_victory_desc:0 "<FTR>你的旗帜压倒了共治者的权柄。你将成为君主的新摄政。"
 ftr_qingjunce_defeat_desc:0 "<FTR>清君侧失败。作为叛逆，你将在牢狱中度过余生。"
 ftr_qingjunce_invalidated_desc:0 "<FTR>局势业已改变，这场战争失去了意义。"

 # ===== 决议确认按钮（引擎按 <key>_confirm 取键，缺省会在 error.log 报 Unrecognized loc key） =====
 ftr_diarchy_abolish_crown_prince_decision_confirm:0 "<FTR>废黜太子"
 ftr_diarchy_depose_liege_decision_confirm:0 "<FTR>废黜君主"
 ftr_diarchy_prepare_coup_decision_confirm:0 "<FTR>准备篡位"
 ftr_diarchy_coup_landing_decision_confirm:0 "<FTR>夺取大位"
 ftr_diarchy_amnesty_decision_confirm:0 "<FTR>颁行大赦"

 # ===== 共治类型显示名（引擎按 <type>_diarchy_type / <type>_diarch_title 取键；
 #       缺任一条则共治窗口标题与 swing 变动提示会显示裸键） =====
 # 类型名：共治窗口标题 / update_diarchy_swing_with_perspective_effect.preamble 的 [liege_loc.GetDiarchyTypeName]
 ftr_diarchy_crown_prince_diarchy_type:0 "<FTR>太子共治"
 # 共治者头衔：共治者名下显示的身份（对照原版 regency_diarch_title「摄政」/ co_monarchy_diarch_title「共治君主」）
 ftr_diarchy_crown_prince_diarch_title:0 "<FTR>太子"
 # ===== 0700 成年晋位太子共治（§2.2 补立：未成年立储不建共治，成年后由 01 主时钟补立） =====
 ftr_diarchy.0700.t:0 "<FTR>太子已长成"
 ftr_diarchy.0700.desc:0 "<FTR>储君[ftr_diarchy_promoted_prince.GetTitledFirstName]已届成年。礼官奏请依制授其共治之权：自此朝堂之上，储君与朕同坐。"
 ftr_diarchy.0700.a:0 "<FTR>依制行之。"
 ftr_diarchy_promotion_notify_title:0 "<FTR>太子共治已立"
 ftr_diarchy_promotion_notify_desc:0 "<FTR>我既已成年，朝廷依制授我共治之权，自此与君上同坐朝堂。"
 # ===== 立储交互 on_accept 的条件提示（§2.2 1.2 / 1.3） =====
 ftr_diarchy_heir_corule_immediate_tt:0 "<FTR>指定成年继承人：立储即刻依制建立#EMP 太子共治#!（行政类政体 + 独立 + 主头衔 ≥ 王国 + 当前无共治）。"
 ftr_diarchy_minor_heir_promotion_tt:0 "<FTR>指定未成年继承人：立储时#EMP 暂不建立共治#!，继承人仍为储君；待其#EMP 成年#!后，朝廷将依制立其为太子共治（届时由朝议补立并告知）。"
 # ===== 天平偏移通知（§7.1）：每一处 swing 写入都向君主与共治者各发一条 message，
 #       正文给出概览，custom_tooltip 详述本次偏移的缘由（点数 / 触发条件 / 来源）=====
 ftr_diarchy_swing_notice_title:0 "<FTR>[scales_of_power|E]发生偏移"
 ftr_diarchy_swing_notice_desc:0 "<FTR>朝堂权力天平再度变动。展开下方提示可见本次偏移的缘由。"
 ftr_diarchy_swing_notice_drift_up:0 "<FTR>季度背书角逐：共治者的党羽多于君主——君主每名党羽按 #P 1.5#! 倍折算溢价后仍落后，天平向#EMP 共治者#!一侧偏移 #P +1#!（单季正向上限）。党羽来自大赦、请愿与逼宫时的表态记账。"
 ftr_diarchy_swing_notice_drift_down:0 "<FTR>季度背书角逐：君主党羽的加权多数压过共治者，天平向#EMP 君主#!一侧回拉（单季下限 #P -3#!；负方向不设门槛，故君主领先必能拉回）。"
 ftr_diarchy_swing_notice_lobby_win:0 "<FTR>党羽游说对垒：共治者一方派出的说客 [ftr_diarchy_pk_diarch_lobbyist.GetName] 在朝中占了上风（双方各出一人，以「智谋 + 外交」评高下，评分高者胜算更大），天平向#EMP 共治者#!一侧上推 #P +5#!；同一政权两年内不会再有此类对垒，出战的说客三年内亦不会再被派出（阵营内部轮换）。"
 ftr_diarchy_swing_notice_lobby_lose:0 "<FTR>党羽游说对垒：君主一方派出的说客 [ftr_diarchy_pk_liege_lobbyist.GetName] 挫败了共治者的游说（双方各出一人，以「智谋 + 外交」评高下，评分高者胜算更大），天平向#EMP 君主#!一侧回拉 #P -5#!；同一政权一年内不会再有此类对垒，出战的说客一年内亦不会再被派出（阵营内部轮换）。"
 ftr_diarchy_swing_notice_external:0 "<FTR>此次[scales_of_power|E]变动不在朝议记账之内：或出自原版事件与天命之变，或出自无地共治者自行#EMP 摆动天平#!，亦或为引擎每月约 #P 0.25#! 的自然回落累积所致。幅度未越门槛的细微漂移不会另行呈报。"
 # ===== 0800 / 0801 天平游说对垒通报（事件体，仅一个确认选项）=====
 ftr_diarchy.0800.t:0 "<FTR>朝堂游说：共治者一方占了上风"
 ftr_diarchy.0800.desc:0 "<FTR>两派各遣说客，在朝堂与官署之间串连游说。此番#EMP 共治者一方#!的说客占了上风，[scales_of_power|E] 再向其一侧偏移。"
 ftr_diarchy.0801.t:0 "<FTR>朝堂游说：君主一方占了上风"
 ftr_diarchy.0801.desc:0 "<FTR>两派各遣说客，在朝堂与官署之间串连游说。此番#EMP 君主一方#!的说客挫败了共治者的游说，[scales_of_power|E] 向君主一侧回拉。"
 ftr_diarchy_pk_event_ok:0 "<FTR>明白了。"
 ftr_diarchy_pk_event_tt:0 "<FTR>对垒规则：双方各自从本方党羽中抽一人出面，以「智谋 + 外交」合计算评分，评分高者胜算更大（基准五成，每 1 点评分差 ±2.5%，夹在 10%~90%）；胜方一次推动天平 #P ±5#!。同一政权两年内不会再有对垒，出战的说客三年内不会再被派出（阵营内部轮换）。"
 ftr_diarchy_swing_notice_qingjunce:0 "<FTR>清君侧功成：清君侧者顶替原共治者就任，天平依其战功向#EMP 新共治者#!一侧上移 #P +10#!——新共治者开局即握有实权。"
 ftr_diarchy_swing_notice_initial_voluntary:0 "<FTR>依制立储：太子共治初立，天平按#EMP 主动立储#!基线置于 #P 10#!——储君须自积党羽方能抬升权力。"
 ftr_court_swing_notice_petition_granted:0 "<FTR>共治请愿获准：请愿所请落地为共治（授权对象不属继承人线时则为固化摄政），天平按#EMP 请愿授权#!基线置于 #P 20#!。"
 ftr_court_swing_notice_imposed:0 "<FTR>党羽逼宫：共治者以逼宫上台，天平按#EMP 逼宫基线#!置于 #P 40#!（太子）或 #P 80#!（共治皇帝・共治君主・摄政）——逼宫所得不可虚位。"
 ftr_court_swing_notice_0500_a:0 "<FTR>暗中进言奏效：君主阵营的说客动摇了共治者的班底，天平向#EMP 君主#!一侧回拉 #P -5#!（八五成算；失手则风声走漏、君主威望受损）。"
 ftr_court_swing_notice_0500_b:0 "<FTR>收买共治者左右：君主以 #P 60#! 金疏通共治者身边之人，天平向#EMP 君主#!一侧回拉 #P -5#!。"
