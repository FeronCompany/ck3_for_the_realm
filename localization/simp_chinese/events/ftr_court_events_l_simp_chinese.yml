l_simp_chinese:

 ###### 0001 潜伏 ######
 ftr_court_struggle.0001.t:0 "殿中低语"
 ftr_court_struggle.0001.desc:0 "下人们私下议论，[ftr_court_candidate.GetFullName]昼夜不停地会见访客——来的都是些有头有脸、腰缠万贯的人物。抓不到把柄。至少眼下还抓不到。"
 ftr_court_struggle.0001.a:0 "这等小事，不值得我过问。"
 ftr_court_struggle.0001.b:0 "传他来见，让他知道我的不满。"
 ftr_court_struggle.0001.c:0 "由他去经营自己的小朝廷，我且看着。"

 ###### 0003 对立 ######
 ftr_court_struggle.0003.t:0 "天无二日"
 ftr_court_struggle.0003.desc:0 "朝堂已经分裂。如今每一次任命都被人解读为风向，每一次冷落都被视作宣战。竞争者互相盯着——也在盯着我。"
 ftr_court_struggle.0003.a:0 "让他们互相消耗去吧。"
 ftr_court_struggle.0003.b:0 "我将扶持声势最盛的那个。"
 ftr_court_struggle.0003.c:0 "够了。我禁止这等内斗。"

 ###### 0005 危机 ######
 ftr_court_struggle.0005.t:0 "刀锋之上"
 ftr_court_struggle.0005.desc:0 "事情已经不止于窃窃私语。望族之间信使往来不绝，其中不止一人所持的印信并非出自我的授意。我若不动手，自有人会动手。"
 ftr_court_struggle.0005.a:0 "继位之事自会有个了断。"
 ftr_court_struggle.0005.b:0 "我必须现在就立储。"
 ftr_court_struggle.0005.c:0 "揪出为首之人，予以痛击。"

 ###### 0010 老君王的命运 ######
 ftr_court_struggle.0010.t:0 "废黜之君"
 ftr_court_struggle.0010.desc:0 "[ftr_court_old_monarch.GetFullName]如今坐在我曾经下跪的位置上。举国屏息，看我将如何处置这顶坠落的后冠。"
 ftr_court_struggle.0010.a:0 "软禁即可，留他性命。"
 ftr_court_struggle.0010.b:0 "投入地牢，让他好生体会其中分量。"
 ftr_court_struggle.0010.c:0 "坠落的后冠，留着颈上人头何用。"

 ###### 0011 其余竞争者 ######
 ftr_court_struggle.0011.t:0 "其余皇子"
 ftr_court_struggle.0011.desc:0 "还有其他人，流着同样的血，怀着同样的指望。有的很快跪了，有的却始终不肯低头。"
 ftr_court_struggle.0011.a:0 "赦免他们，并兑现我的许诺。"
 ftr_court_struggle.0011.b:0 "擒贼先擒王——拿下威胁最大的那个对手。"
 ftr_court_struggle.0011.c:0 "让他们保留封地，我会盯着他们。"

 ###### 0012 竞争者的抉择 ######
 ftr_court_struggle.0012.t:0 "屈膝，还是起兵"
 ftr_court_struggle.0012.desc:0 "[ftr_court_new_monarch.GetFullName]头戴的那顶冠冕，论理本该是我的。我麾下的兵马仍听我号令。问题只在于，我敢不敢。"
 ftr_court_struggle.0012.a:0 "决不。我要以武力主张我的权利。"
 ftr_court_struggle.0012.b:0 "忍辱负重，屈膝称臣。"

 ###### 0013 处置叛乱者 ######
 ftr_court_struggle.0013.t:0 "阶下之囚"
 ftr_court_struggle.0013.desc:0 "[ftr_court_warleader.GetFullName]押上一切来赌我的王冠，结果输了个精光。继承之名已从名册上抹去，叛旗已被践碎，叛乱者如今跪在我的地牢里。剩下的，是决定这份「忠心」究竟值多少。"
 ftr_court_struggle.0013.a:0 "让他在地牢里了此残生。"
 ftr_court_struggle.0013.b:0 "将他们逐出国境。"
 ftr_court_struggle.0013.c:0 "杀一儆百。"
 ftr_court_struggle.0013.d:0 "他已经失去得够多了。"

 ###### 0016 内阁承诺首次提醒 ######
 ftr_court_struggle.0016.t:0 "欠下的席位"
 ftr_court_struggle.0016.desc:0 "王冠已落到[ROOT.GetTitledFirstNamePossessive]头上，随之一同而来的，还有通往大位路上一笔笔许下的承诺。[ftr_court_promised_vassal.GetFullName]当年出力扶持，换的是一个内阁席位。满朝文武都在看着，这些话究竟算不算数。"
 ftr_court_struggle.0016.a:0 "一诺千金，授职。"
 ftr_court_struggle.0016.b:0 "时机未到，容后再议。"

 ###### 0017 内阁承诺终裁 ######
 ftr_court_struggle.0017.t:0 "耐心耗尽"
 ftr_court_struggle.0017.desc:0 "[ftr_court_promised_vassal.GetFullName]已经等得够久了。自那日许下内阁席位，数月过去，职位却始终没有着落。今日，他们要一个明确的答复——满朝文武，同样在看。"
 ftr_court_struggle.0017.a:0 "罢了，授职。"
 ftr_court_struggle.0017.b:0 "王冠不欠任何人。驳回。"

 ###### 0018 废黜昏君 ######
 ftr_court_struggle.0018.t:0 "提线在手"
 ftr_court_struggle.0018.desc:0 "[ftr_court_monarch.GetTitledFirstName]在别人递来的任何文书上盖印，近来每一道诏令都带着我的指纹。满朝向我鞠躬，只是名义上跪在他们面前。一切只差一步——而且不会有人哀悼。"
 ftr_court_struggle.0018.a:0 "提线在手，何不连龙椅一起拿过来？"
 ftr_court_struggle.0018.b:0 "提线已经够了——暂时。"

 ###### 0019 朝堂权力角逐开始 ######
 ftr_court_struggle.0019.t:0 "继位之争，就此拉开帷幕"
 ftr_court_struggle.0019.desc:0 "继承问题已经有了答案——不，不是答案，而是被重新抛向风口浪尖。在[ftr_court_monarch.GetTitledFirstName]周围，竞争者虎视眈眈，内阁成员各自选边。朝堂上的权力角逐已经开始，每一个有权势的人都必须决定自己的立场归于何处。"
 ftr_court_struggle.0019.a:0 "我会密切关注这股权力潮汐。"

 ###### 0014 朝堂站队 ######
 ftr_court_struggle.0014.t:0 "择主而事"
 ftr_court_struggle.0014.desc:0 "朝堂正在悄然分化，中立正成为最危险的立场。是时候决定该追随哪颗星了。"
 ftr_court_struggle.0014.a:0 "拥立[ftr_court_claimant_1.GetFullName]"
 ftr_court_struggle.0014.b:0 "拥立[ftr_court_claimant_2.GetFullName]"
 ftr_court_struggle.0014.c:0 "拥立[ftr_court_claimant_3.GetFullName]"
 ftr_court_struggle.0014.d:0 "拥立[ftr_court_claimant_4.GetFullName]"
 ftr_court_struggle.0014.e:0 "拥立[ftr_court_claimant_5.GetFullName]"
 ftr_court_struggle.0014.f:0 "静观其变。"

 ###### 0015 竞争者抉择 ######
 ftr_court_struggle.0015.t:0 "良机已至"
 ftr_court_struggle.0015.desc:0 "支持者已经聚拢，积怨早已摆上台面，年迈的[ftr_court_monarch.GetTitledFirstName]一天弱过一天。众人都在等一个信号。此刻若再迟疑，他们便会转头去寻别人。"
 ftr_court_struggle.0015.a:0 "举旗起兵。"
 ftr_court_struggle.0015.b:0 "暗影中动手。"
 ftr_court_struggle.0015.c:0 "再等等，从长计议。"

 ###### 0020 共治请愿 ######
 ftr_court_struggle.0020.t:0 "请分国事之忧"
 ftr_court_struggle.0020.desc:0 "[actor.GetFullName]恭恭敬敬地跪下，以最谦卑的措辞奏请——将治国之重担分而担之。措辞无懈可击。正因如此，才最危险。"
 ftr_court_struggle.0020.a:0 "好吧。分忧就分忧。"
 ftr_court_struggle.0020.b:0 "君权不可与人分。驳回。"

 ###### 0040 是否参与继位角逐 ######
 ftr_court_struggle.0040.t:0 "是否参与角逐"
 ftr_court_struggle.0040.desc:0 "[ftr_court_monarch.GetTitledFirstName]年事已高，大位归属已被重新抛向风口浪尖。[ROOT.GetFullName]是挺身而出、角逐大位，还是退居一旁，坐看他人相争？"
 ftr_court_struggle.0040.a:0 "我要角逐这大位。"
 ftr_court_struggle.0040.b:0 "这场角逐，我无意参与。"

 ###### 0041 君主警觉 ######
 ftr_court_struggle.0041.t:0 "不忠的耳语"
 ftr_court_struggle.0041.desc:0 "有密报传到[ROOT.GetTitledFirstName]耳中，称某位臣属已公开为朝堂上的另一方背书。当大位悬而未决时，究竟谁的忠诚还靠得住？"
 ftr_court_struggle.0041.a:0 "我要好生盯着[ftr_court_supported.GetFullName]。"
 ftr_court_struggle.0041.b:0 "无足轻重罢了。"

###### 0050-0056 诬陷下毒链（§12.4.2 手段 2.1）######
 ftr_court_struggle.0050.t:0 "谣言如刃"
 ftr_court_struggle.0050.desc:0 "争夺大位的较量已转入暗处。[ROOT.GetTitledFirstName]决定先发制人，命心腹在朝堂散布关于[scope:ftr_court_victim.GetFullName]贪墨、不忠的流言。是非曲直，只在人心。"
 ftr_court_struggle.0050.a:0 "传扬流言，中伤其声望。"
 ftr_court_struggle.0050.b:0 "兹事体大，暂且忍下。"
 ftr_court_struggle.0051.t:0 "作伪证以售其奸"
 ftr_court_struggle.0051.desc:0 "[ROOT.GetTitledFirstName]伪造了一纸[scope:ftr_court_victim.GetFullName]贪墨公帑的"铁证"，趁其不备呈递御前。只要君主采信，[scope:ftr_court_victim.GetFullName]便声名扫地。"
 ftr_court_struggle.0051.a:0 "递上伪证，构陷[scope:ftr_court_victim.GetFullName]。"
 ftr_court_struggle.0051.b:0 "伪造之事终究瞒不过上天，作罢。"
 ftr_court_struggle.0052.t:0 "杯中之毒"
 ftr_court_struggle.0052.desc:0 "暗影中的一步。[ROOT.GetTitledFirstName]得了一份见血封喉的毒药。一念之间，便可让[scope:ftr_court_victim.GetFullName]就此退出这场角逐——或永远消失。"
 ftr_court_struggle.0052.a:0 "下致命之毒。"
 ftr_court_struggle.0052.b:0 "下慢性毒药，使其缠绵病榻。"
 ftr_court_struggle.0052.c:0 "终究下不去手。"
 ftr_court_struggle.0053.t:0 "风声走漏"
 ftr_court_struggle.0053.desc:0 "[ROOT.GetTitledFirstName]方知[scope:ftr_court_actor.GetFullName]在朝堂中散布流言中伤自己。若不设法还以颜色，威信恐将扫地。"
 ftr_court_struggle.0053.a:0 "以其人之道还治其人之身。"
 ftr_court_struggle.0053.b:0 "清者自清，暂且忍耐。"
 ftr_court_struggle.0054.t:0 "贪腐之罪"
 ftr_court_struggle.0054.desc:0 "[ROOT.GetTitledFirstName]被卷入了贪墨公帑的指控。尽管那是伪造的，可证据确凿地摆在[ftr_court_arbiter.GetTitledFirstName]面前——除非能当庭自辩清白。"
 ftr_court_struggle.0054.a:0 "慷慨陈词，力辩清白。"
 ftr_court_struggle.0054.b:0 "人言可畏，索性缄默。"
 ftr_court_struggle.0055.t:0 "毒发"
 ftr_court_struggle.0055.desc:0 "一股撕裂脏腑的剧痛袭来。[ROOT.GetTitledFirstName]意识到自己中了毒——是朝堂上的哪个对手下的手？"
 ftr_court_struggle.0055.a:0 "传太医！"
 ftr_court_struggle.0056.t:0 "日渐虚弱"
 ftr_court_struggle.0056.desc:0 "[ROOT.GetTitledFirstName]近来头晕目眩、气力不济。饮食中似乎被掺了某种缓慢发作的毒物，教人日渐消沉。"
 ftr_court_struggle.0056.a:0 "须得彻查府中饮食。"
 ftr_court_struggle.0057.t:0 "舆论战升级"
 ftr_court_struggle.0057.desc:0 "流言如野火般蔓延。[ROOT.GetTitledFirstName]与[ftr_court_actor.GetTitledFirstName]相互攻讦，朝堂上下议论纷纷。是继续以谣攻谣，把两人都拖下水，还是就此收手？"
 ftr_court_struggle.0057.a:0 "奉陪到底——以其人之道还治其人之身。"
 ftr_court_struggle.0057.b:0 "鸣金收兵，暂避锋芒。"
 ftr_court_struggle.0058.t:0 "伪造者伏法"
 ftr_court_struggle.0058.desc:0 "彻查之下，所谓证据实系[ftr_court_inq_actor.GetTitledFirstName]伪造——如今[ftr_court_inq_victim.GetTitledFirstName]清白已证，该当如何处置这个构陷者？"
 ftr_court_struggle.0058.a:0 "收押查办，以儆效尤。"
 ftr_court_struggle.0058.b:0 "当众斥责，削其颜面。"
 ftr_court_struggle.0058.c:0 "冤冤相报何时了，放他一马。"
 ftr_court_struggle.0059.t:0 "追凶"
 ftr_court_struggle.0059.desc:0 "中毒之后，[ROOT.GetTitledFirstName]心思百转——那杯中的毒物、那盘中的异样，恐怕都与[ftr_court_actor.GetTitledFirstName]脱不了干系。要不要继续追查下去？"
 ftr_court_struggle.0059.a:0 "绝不罢休，追查到底！"
 ftr_court_struggle.0059.b:0 "无凭无据，只能咽下这口气。"

###### 0060 派间谍调查 / 0090 谋杀（手段 2.2 / 2.5）######
 ftr_court_struggle.0060.t:0 "密探之眼"
 ftr_court_struggle.0060.desc:0 "朝堂上明争暗斗愈演愈烈，[ROOT.GetTitledFirstName]打算遣最精干的密探，暗中彻查那个风头最劲的竞争者，看他有无可被拿捏的把柄。"
 ftr_court_struggle.0060.a:0 "彻查并当众揭发其劣迹。"
 ftr_court_struggle.0060.b:0 "知己知彼亦可，暂且按兵不动。"
 ftr_court_struggle.0090.t:0 "行刺之谋"
 ftr_court_struggle.0090.desc:0 "[ROOT.GetTitledFirstName]与[scope:ftr_court_victim.GetFullName]的争位已至不死不休。[ROOT.GetTitledFirstName]盘算着，与其堂堂正正落败，不如雇几名亡命之徒，叫此人再也无法碍事。"
 ftr_court_struggle.0090.a:0 "收买刺客，取其性命。"
 ftr_court_struggle.0090.b:0 "退而求其次，寻个把柄拿捏他。"
 ftr_court_struggle.0090.c:0 "刀剑无眼，此事不可为。"

###### 0070 牵制 / 0080 绑架（手段 2.3 / 2.4）######
 ftr_court_struggle.0070.t:0 "把柄在握"
 ftr_court_struggle.0070.desc:0 "多年经营的人脉给[ROOT.GetTitledFirstName]带来了回报：心腹探知了[scope:ftr_court_victim.GetFullName]一件见不得光的隐秘。是用它私下要挟，还是当众抖落，好叫此人颜面扫地？"
 ftr_court_struggle.0070.a:0 "握此把柄，私下要挟。"
 ftr_court_struggle.0070.b:0 "当众抖落，削其颜面。"
 ftr_court_struggle.0080.t:0 "夜半掳人"
 ftr_court_struggle.0080.desc:0 "胜负已不在一纸朝争之上。[ROOT.GetTitledFirstName]雇了一队亡命之徒，欲趁夜将[scope:ftr_court_victim.GetFullName]掳走，教他尝尝被刀架在脖子上的滋味。"
 ftr_court_struggle.0080.a:0 "连夜将其掳走，逼其退让。"
 ftr_court_struggle.0080.b:0 "恐吓一番便放，取其胆寒。"
 ftr_court_struggle.0080.c:0 "掳人终究有干天和，作罢。"
 ftr_court_struggle.0071.t:0 "把柄生风"
 ftr_court_struggle.0071.desc:0 "[ROOT.GetTitledFirstName]手中的把柄如刃在握——[ftr_court_leverage_holder_victim.GetTitledFirstName]的命脉攥在你的手心。是逼其让利，还是当众撕破脸皮？"
 ftr_court_struggle.0071.a:0 "借此逼其退让，谋取实利。"
 ftr_court_struggle.0071.b:0 "当众揭穿，叫此人名誉扫地。"
 ftr_court_struggle.0071.c:0 "把柄还他，换一份人情。"
 ftr_court_struggle.0072.t:0 "反咬一口"
 ftr_court_struggle.0072.desc:0 "[ftr_court_leverage_holder_victim.GetTitledFirstName]绝非任人拿捏之辈——你自以为得计的把柄，竟被此人当众拆穿，反将你一军。"
 ftr_court_struggle.0072.a:0 "好一个厉害角色……这口气只能咽下。"
 ftr_court_struggle.0081.t:0 "刀下之囚"
 ftr_court_struggle.0081.desc:0 "一夜惊魂后，[ROOT.GetTitledFirstName]终于看清了眼前的人——[ftr_court_actor.GetTitledFirstName]的刀已架在脖子上。是屈服认栽、宁死不从，还是设法反扑？"
 ftr_court_struggle.0081.a:0 "留得青山在，认栽退让。"
 ftr_court_struggle.0081.b:0 "大丈夫可杀不可辱！"
 ftr_court_struggle.0081.c:0 "今日之辱，来日百倍奉还。"
 ftr_court_struggle.0082.t:0 "反扑落网"
 ftr_court_struggle.0082.desc:0 "[ftr_court_victim.GetTitledFirstName]的报复来得又快又狠——[ROOT.GetTitledFirstName]掳人一事败露，朝堂上满是鄙夷的目光。"
 ftr_court_struggle.0082.a:0 "一步错，步步错……"
 ftr_court_struggle.00A1.t:0 "暗中策动"
 ftr_court_struggle.00A1.desc:0 "共治者权柄日盛，而[ROOT.GetTitledFirstName]身无寸土，只能暗中行事——联络对共治者不满的朝臣，在君前吹冷风、下眼药。"
 ftr_court_struggle.00A1.a:0 "暗中进言，削弱共治之势。"
 ftr_court_struggle.00A1.b:0 "花钱收买共治者左右，徐徐图之。"
 ftr_court_struggle.00A1.c:0 "时机未到，暂且隐忍。"
 ftr_court_struggle.00A2.t:0 "共治者反击"
 ftr_court_struggle.00A2.desc:0 "保皇党步步紧逼，[ROOT.GetTitledFirstName]的共治地位摇摇欲坠。是命亲信在朝堂内外游说拉拢，还是暂且蛰伏？"
 ftr_court_struggle.00A2.a:0 "密令亲信游说，把人心拉回来。"
 ftr_court_struggle.00A2.b:0 "暂避锋芒，来日再战。"
