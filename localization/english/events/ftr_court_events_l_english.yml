l_english:

 ###### 0003 对立 ######
 ftr_court_struggle.0003.t:0 "Two Suns in One Sky"
 ftr_court_struggle.0003.desc:0 "The court has begun to divide. Every appointment is now read as a signal, every slight as a declaration. The contenders watch each other — and watch me."
 ftr_court_struggle.0003.a:0 "Let them wear themselves out."
 ftr_court_struggle.0003.b:0 "I will favour the strongest."
 ftr_court_struggle.0003.c:0 "Enough. I forbid this infighting."

 ###### 0004 危机 ######
 ftr_court_struggle.0004.t:0 "The Edge of the Knife"
 ftr_court_struggle.0004.desc:0 "It has gone beyond whispers. Messengers move between the great houses, and more than one of them carries a seal that is not mine. If I do not act, someone else will."
 ftr_court_struggle.0004.a:0 "The succession will resolve itself."
 ftr_court_struggle.0004.b:0 "I must name my successor — now."
 ftr_court_struggle.0004.c:0 "Find the ringleader and break them."

 ###### 0100 老君王的命运 ######
 ftr_court_struggle.0100.t:0 "The Deposed"
 ftr_court_struggle.0100.desc:0 "[ftr_court_old_monarch.GetFullName] sits where I once knelt. The realm holds its breath to see what I shall do with a fallen crown."
 ftr_court_struggle.0100.a:0 "House arrest. They live."
 ftr_court_struggle.0100.b:0 "The dungeon. Let them feel the weight of it."
 ftr_court_struggle.0100.c:0 "A fallen crown has no use for a head."

 ###### 0110 其余竞争者 ######
 ftr_court_struggle.0110.t:0 "The Other Heirs"
 ftr_court_struggle.0110.desc:0 "There are others who bore the same blood and the same hope. Some bent the knee quickly. Some did not bend at all."
 ftr_court_struggle.0110.a:0 "Pardon them, and honour what I promised."
 ftr_court_struggle.0110.b:0 "Strike the loudest voice — seize the greatest threat."
 ftr_court_struggle.0110.c:0 "Let them keep their lands. I will watch them."

 ###### 0120 竞争者的抉择 ######
 ftr_court_struggle.0120.t:0 "Bend, or Break"
 ftr_court_struggle.0120.desc:0 "[ftr_court_new_monarch.GetFullName] wears a crown that by rights could have been mine. My levies are still mine to call. The question is whether I dare."
 ftr_court_struggle.0120.a:0 "Never. I press my claim by force."
 ftr_court_struggle.0120.b:0 "I swallow my pride and bend the knee."

 ###### 0130 处置叛乱者 ######
 ftr_court_struggle.0130.t:0 "The Rebel in Chains"
 ftr_court_struggle.0130.desc:0 "[ftr_court_warleader.GetFullName] gambled for my crown and lost. The claim is struck from the succession, the banners are broken, and the rebel now kneels in my dungeon. What remains is to decide what their loyalty was worth."
 ftr_court_struggle.0130.a:0 "Let them rot in the dungeon."
 ftr_court_struggle.0130.b:0 "Cast them out of the realm."
 ftr_court_struggle.0130.c:0 "An example must be made."
 ftr_court_struggle.0130.d:0 "They have lost enough already."

 ###### 0016 内阁承诺首次提醒 ######
 ftr_court_struggle.0016.t:0 "A Seat Owed"
 ftr_court_struggle.0016.desc:0 "The crown has settled upon [ROOT.Char.GetTitledFirstNamePossessive] head, and with it the ledger of promises made on the road to power. [ftr_court_promised_vassal.GetFullName] supported this claim in exchange for a seat upon the council. The court is watching whether such words mean anything."
 ftr_court_struggle.0016.a:0 "A promise is a promise. Grant the seat."
 ftr_court_struggle.0016.b:0 "The time is not right. Postpone it."

 ###### 0017 内阁承诺终裁 ######
 ftr_court_struggle.0017.t:0 "The Patience Runs Out"
 ftr_court_struggle.0017.desc:0 "[ftr_court_promised_vassal.GetFullName] has waited long enough. Months have passed since the promise of a council seat, and no position has materialised. Today they demand an answer — and the court watches with them."
 ftr_court_struggle.0017.a:0 "Enough. Grant the seat."
 ftr_court_struggle.0017.b:0 "The throne owes nothing. Refused."

 ###### 0150 废黜昏君 ######
 ftr_court_struggle.0150.t:0 "The Strings Are Mine"
 ftr_court_struggle.0150.desc:0 "The [ftr_court_monarch.GetTitledFirstName] signs whatever is placed before them, and every decree of late bears my fingerprints. The court bows to me while kneel formally to them. It would take so little — and no one would mourn."
 ftr_court_struggle.0150.a:0 "Why should the strings not come with a throne?"
 ftr_court_struggle.0150.b:0 "The strings are enough — for now."

 ###### 0001 朝堂权力角逐开始 ######
 ftr_court_struggle.0001.t:0 "The Contest for the Throne Begins"
 ftr_court_struggle.0001.desc:0 "The question of succession has been answered — no, not answered, but thrown open. Around [ftr_court_monarch.GetTitledFirstName], claimants circle and councillors choose sides. The struggle for the Crown has begun, and every man and woman of power must now decide where their allegiance lies."
 ftr_court_struggle.0001.a:0 "I will watch the tide of power closely."

###### 0002 The court struggle ends ######
 ftr_court_struggle.0002.t:0 "The Dust Settles"
 ftr_court_struggle.0002.desc:0 "The struggle for power around [ftr_court_monarch.GetTitledFirstName] has come to an end. The quarrelling voices of the court fall silent and the undercurrents fade. Some have gained what they sought, others have stepped away in defeat, and many simply breathe a sigh of relief — the contest is over at last."
 ftr_court_struggle.0002.a:0 "At last, calm returns."

 ###### 0200 朝堂站队 ######
 ftr_court_struggle.0200.t:0 "Choosing Sides"
 ftr_court_struggle.0200.desc:0 "The court is quietly splitting into camps, and neutrality is becoming the most dangerous position of all. It is time to decide whose star to follow."
 ftr_court_struggle.0200.a:0 "Back [ftr_court_claimant_1.GetFullName]"
 ftr_court_struggle.0200.b:0 "Back [ftr_court_claimant_2.GetFullName]"
 ftr_court_struggle.0200.c:0 "Back [ftr_court_claimant_3.GetFullName]"
 ftr_court_struggle.0200.d:0 "Back [ftr_court_claimant_4.GetFullName]"
 ftr_court_struggle.0200.e:0 "Back [ftr_court_claimant_5.GetFullName]"
 ftr_court_struggle.0200.f:0 "Watch and wait."
 ftr_court_struggle.0200.g:0 "Swear to [ftr_court_monarch.GetTitledFirstName]"
 ftr_court_struggle.0200.h:0 "Back the Co-Ruler [ftr_court_diarch.GetTitledFirstName]"
 ftr_court_apply_backing_effect.liege_notify_text:0 "This may lead to alert and anger of top liege"
 ftr_court_struggle.0200.offer_back_tt:0 "Offer your open backing to the contender and await their answer. If accepted, the backing is formally established and goodwill grows between you, yet other claimants take offence and the liege may grow wary. If refused, your relationship sours."

 ###### 0210 拥立需得首肯 ######
 ftr_court_struggle.0210.t:0 "A Supporter Steps Forward"
 ftr_court_struggle.0210.desc:0 "[ftr_court_offerer.GetTitledFirstName] approaches, vowing openly to back [ROOT.Char.GetTitledFirstName]'s claim to the throne. Their allegiance could be a boon — or an invitation for scorn. Whether to accept it lies with [ROOT.Char.GetFirstName] alone."
 ftr_court_struggle.0210.desc_monarch:0 "[ftr_court_offerer.GetTitledFirstName] approaches, swearing open loyalty and offering to carry the Crown's banner in court. Such allegiance could be a boon — or an invitation for scorn. Whether to accept it lies with [ROOT.Char.GetFirstName] alone."
 ftr_court_struggle.0210.desc_diarch:0 "[ftr_court_offerer.GetTitledFirstName] approaches, offering to back [ROOT.Char.GetTitledFirstName] openly as their partisan. It could be a boon — or draw the monarch's wary eye. Whether to accept it lies with [ROOT.Char.GetFirstName] alone."
 ftr_court_struggle.0210.a:0 "I will accept this backing."
 ftr_court_struggle.0210.b:0 "No. I need no open supporters."
 ftr_court_struggle.0210.accept_notify:0 "Your backing has been accepted"
 ftr_court_struggle.0210.refuse_notify:0 "Your backing has been refused"

 ###### 0140 竞争者抉择 ######
 ftr_court_struggle.0140.t:0 "The Time Is Now"
 ftr_court_struggle.0140.desc:0 "Supporters have gathered, grievances have been aired, and the old [ftr_court_monarch.GetTitledFirstName] weakens by the day. Men look to me for a signal. Hesitate now, and they will look elsewhere."
 ftr_court_struggle.0140.a:0 "Raise the banners."
 ftr_court_struggle.0140.b:0 "Strike from the shadows."
 ftr_court_struggle.0140.c:0 "Bide my time a while longer."

 ###### 0220 共治请愿 ######
 ftr_court_struggle.0220.t:0 "A Request to Share the Burden"
 ftr_court_struggle.0220.desc:0 "[actor.GetFullName] kneels with all due humility, and asks — in the most courteous of terms — that the burdens of rule be shared. The phrasing is flawless. That is what makes it dangerous."
 ftr_court_struggle.0220.a:0 "Very well. Share the burden."
 ftr_court_struggle.0220.b:0 "The Crown does not share. Refused."

 ###### 0230 是否参与继位角逐 ######
 ftr_court_struggle.0230.t:0 "To Enter the Contest"
 ftr_court_struggle.0230.desc:0 "[ftr_court_monarch.GetTitledFirstName] grows old, and the question of the throne has been thrown open. Should [ROOT.Char.GetFullName] stake a claim and enter the contest, or stand aside and let others fight it out?"
 ftr_court_struggle.0230.a:0 "I will enter the contest for the throne."
 ftr_court_struggle.0230.b:0 "I want no part in this contest."

###### 0601 Impeachment Verdict Receipts (M1) ######
 ftr_court_impeach_notify_grant_actor_title:0 "Impeachment Upheld"
 ftr_court_impeach_notify_grant_actor_desc:0 "My petition was granted, and [ftr_court_impeach_target.GetTitledFirstName] has lost his council seat."
 ftr_court_impeach_notify_grant_target_title:0 "Dismissed from Court"
 ftr_court_impeach_notify_grant_target_desc:0 "The petition was granted, and I have lost my seat on the council."
 ftr_court_impeach_notify_refuse_actor_title:0 "Petition Shelved"
 ftr_court_impeach_notify_refuse_actor_desc:0 "My petition was shelved, and [ftr_court_impeach_target.GetTitledFirstName] keeps his seat."
 ftr_court_impeach_notify_refuse_target_title:0 "Seat Preserved"
 ftr_court_impeach_notify_refuse_target_desc:0 "The petition was shelved, and my council seat is safe."
 ftr_court_impeach_notify_quell_title:0 "The Liege Intervenes"
 ftr_court_impeach_notify_quell_desc:0 "My liege intervened in person, and the matter of the impeachment is laid to rest."
 ftr_court_impeach_notify_delay_title:0 "No Ruling Given"
 ftr_court_impeach_notify_delay_desc:0 "My liege hedged and gave no clear ruling."
 ftr_court_impeach_delay_tt:0 "Hedge and delay: no clear ruling is given; the impeacher resents you, and tension rises slightly."
 ftr_court_debate_dodge_tt:0 "Decline the debate: you lose prestige, the challenger thinks less of you, and the matter festers — tension rises slightly."
 ftr_court_duel_settle_tt:0 "The combat is decided: the winner gains much prestige (+200), the loser loses standing (−120) and his camp drifts from him; tension rises slightly."
 ftr_court_appraisal_settle_tt:0 "The verdict is in: if the praise lands, the subject gains merit or influence according to his government (prestige otherwise) and thanks you; if the condemnation lands he loses face and resents you; if the appraisal fails, your own standing suffers. Tension rises slightly."
 ftr_court_omen_settle_tt:0 "The inquiry is done: if exposed, the claimant loses much prestige (−250) and the court gains a little; if inconclusive, the omen stands, his prestige soars, and tension rises sharply."

###### 0620 / 0621 Jurisdiction Dispute & Trial by Combat (M4, civil strife) ######
 ftr_court_struggle.0620.t:0 "Judgment at Court"
 ftr_court_struggle.0620.desc:0 "[ftr_court_duel_plaintiff.GetTitledFirstName] and [ftr_court_duel_defendant.GetTitledFirstName] quarrel endlessly over borders and jurisdiction, and both lay their pleas before me."
 ftr_court_struggle.0620.a:0 "Let them settle it by combat in my hall."
 ftr_court_struggle.0620.b:0 "Rule in favour of [ftr_court_duel_plaintiff.GetTitledFirstName]."
 ftr_court_struggle.0620.c:0 "Rule in favour of [ftr_court_duel_defendant.GetTitledFirstName]."
 ftr_court_struggle.0620.d:0 "Set the whole matter aside."
 ftr_court_duel_combat_tt:0 "The two will fight before the court, prowess and martial skill deciding. The loser loses standing, and his camp drifts away from him."
 ftr_court_duel_verdict_tt:0 "Rule for one side: the winner gains prestige, the loser loses face and resents both the winner and you."
 ftr_court_duel_dismiss_tt:0 "Set it aside: the quarrel festers, both sides resent you, and tension rises."
 ftr_court_duel_notify_verdict_win_title:0 "Judgment: I Prevailed"
 ftr_court_duel_notify_verdict_win_desc:0 "The ruling went my way, and the land is mine."
 ftr_court_duel_notify_verdict_lose_title:0 "Judgment: I Lost"
 ftr_court_duel_notify_verdict_lose_desc:0 "The ruling went against me. I will remember it."
 ftr_court_duel_notify_dismissed_title:0 "Plea Unheard"
 ftr_court_duel_notify_dismissed_desc:0 "My plea was set aside — neither judged nor soothed."
 ftr_court_struggle.0621.t:0 "Trial by Combat"
 ftr_court_struggle.0621.desc_plaintiff:0 "In the hall, [ftr_court_duel_plaintiff.GetTitledFirstName] struck [ftr_court_duel_defendant.GetTitledFirstName] to the ground, and the matter was settled."
 ftr_court_struggle.0621.desc_defendant:0 "In the hall, [ftr_court_duel_defendant.GetTitledFirstName] broke [ftr_court_duel_plaintiff.GetTitledFirstName]'s case by force of arms."
 ftr_court_struggle.0621.a:0 "The court is dismissed."
 ftr_court_duel_notify_win_title:0 "Victory in Combat"
 ftr_court_duel_notify_win_desc:0 "Before the whole court I won the contest of arms, and my name grows."
 ftr_court_duel_notify_lose_title:0 "Defeat in Combat"
 ftr_court_duel_notify_lose_desc:0 "I lost the trial by combat, and with it standing and followers."

###### 0630 / 0631 Public Appraisal (M5, civil strife) ######
 ftr_court_struggle.0630.t:0 "A Month's Verdict"
 ftr_court_struggle.0630.desc:0 "Among scholars, reputations turn on a single pen. Every word [ftr_court_appraisal_target.GetTitledFirstName] speaks is weighed by me — one phrase of mine can raise him high or cast him down."
 ftr_court_struggle.0630.a:0 "Praise him: raise his name and win his favour."
 ftr_court_struggle.0630.b:0 "Condemn him: declare his conduct unworthy."
 ftr_court_struggle.0630.c:0 "This is no business of mine."
 ftr_court_appraisal_praise_tt:0 "Rate him well: on success he gains merit or influence according to his government (prestige otherwise) and thanks me; a clumsy appraisal backfires on my standing."
 ftr_court_appraisal_smear_tt:0 "Rate him ill: on success he loses prestige, resents me, and tension rises; a clumsy appraisal backfires on my standing."
 ftr_court_struggle.0631.t:0 "Judged Before All"
 ftr_court_struggle.0631.desc_praise:0 "Before the assembled scholars I spoke well of [ftr_court_appraisal_target.GetTitledFirstName], and the room agreed — his standing is the greater for it."
 ftr_court_struggle.0631.desc_smear:0 "I declared [ftr_court_appraisal_target.GetTitledFirstName] unworthy before all, and the talk did its work — his name is tarnished."
 ftr_court_struggle.0631.desc_backfire:0 "None believed my verdict, and I was accused of judging out of spite. My own name suffers."
 ftr_court_struggle.0631.a:0 "Let them talk."
 ftr_court_appraisal_notify_praised_title:0 "Praised by Scholars"
 ftr_court_appraisal_notify_praised_desc:0 "[ftr_court_appraisal_actor.GetTitledFirstName] spoke well of me among scholars, and name and substance followed."
 ftr_court_appraisal_notify_smeared_title:0 "Condemned by Scholars"
 ftr_court_appraisal_notify_smeared_desc:0 "[ftr_court_appraisal_actor.GetTitledFirstName] publicly called my conduct unworthy, and my name suffers."
 ftr_court_appraisal_notify_backfire_title:0 "Appraisal Rebounded"
 ftr_court_appraisal_notify_backfire_desc:0 "[ftr_court_appraisal_actor.GetTitledFirstName] tried to damn me by scholarship, but none believed him — and his own standing suffered."

###### 0640 / 0641 Auspicious Omen & Inquiry (M6, civil strife) ######
 ftr_court_struggle.0640.t:0 "An Omen Reported"
 ftr_court_struggle.0640.desc:0 "[ftr_court_omen_faker.GetTitledFirstName] reports an auspicious omen and asks the court to proclaim it. Is Heaven truly speaking — or is a faction making noise?"
 ftr_court_struggle.0640.a:0 "Endorse the omen and proclaim it."
 ftr_court_struggle.0640.b:0 "Send scholars to examine it."
 ftr_court_struggle.0640.c:0 "Ignore it."
 ftr_court_omen_endorse_tt:0 "Endorse the omen: he gains much prestige, his camp grows bolder, and tension rises."
 ftr_court_omen_inquiry_tt:0 "Send scholars: if exposed, he loses much prestige and the court gains a little; if inconclusive, the omen stands, his prestige soars, and tension rises sharply."
 ftr_court_omen_ignore_tt:0 "Ignore it: neither endorsed nor examined, rumour hardens into fact, and tension rises noticeably."
 ftr_court_struggle.0641.t:0 "Examining the Heavens"
 ftr_court_struggle.0641.desc_debunked:0 "The scholars examine stars and evidence alike: what [ftr_court_omen_faker.GetTitledFirstName] called an omen is wholly fabricated, and the court murmurs."
 ftr_court_struggle.0641.desc_upheld:0 "The scholars examine the matter again and again and cannot call it false — the omen of [ftr_court_omen_faker.GetTitledFirstName] stands."
 ftr_court_struggle.0641.a:0 "Let it rest."
 ftr_court_omen_notify_endorsed_title:0 "Omen Endorsed"
 ftr_court_omen_notify_endorsed_desc:0 "The court accepted the omen I reported, and my prestige soars."
 ftr_court_omen_notify_debunked_title:0 "Omen Exposed"
 ftr_court_omen_notify_debunked_desc:0 "Under the scholars' scrutiny my omen was called a fabrication, and my prestige suffers."
 ftr_court_omen_notify_survived_title:0 "Omen Upheld"
 ftr_court_omen_notify_survived_desc:0 "The inquiry could not disprove it — my omen stands, and my prestige soars."
 ftr_court_omen_notify_ignored_title:0 "Omen Unanswered"
 ftr_court_omen_notify_ignored_desc:0 "The court neither endorsed nor examined my omen, leaving it to spread on its own."

###### 0610–0612 Court Debate (M2/M3, civil strife) ######
 ftr_court_struggle.0610.t:0 "A Debate in the Hall"
 ftr_court_struggle.0610.desc_stance:0 "As fellow courtiers, [ftr_court_debate_rival.GetTitledFirstName]'s stance grates against mine. Rather than let his ideas gain ground, better to challenge him to a debate before the court."
 ftr_court_struggle.0610.desc_claim:0 "On the succession claim of [ftr_court_debate_subject.GetTitledFirstName], [ftr_court_debate_rival.GetTitledFirstName] boasts loudly — yet I hold the claim ill-founded. Let it be argued in open court."
 ftr_court_struggle.0610.a:0 "Challenge him openly to a debate."
 ftr_court_struggle.0610.b:0 "Not worth a war of words."
 ftr_court_debate_challenge_tt:0 "Send the challenge. He will decide whether to accept: if he does, the court will judge who has the sharper learning and wit."
 ftr_court_struggle.0611.t:0 "A Challenge to Debate"
 ftr_court_struggle.0611.desc_stance:0 "[ftr_court_debate_challenger.GetTitledFirstName] publicly calls me out on matters of policy — every word a barb."
 ftr_court_struggle.0611.desc_claim:0 "[ftr_court_debate_challenger.GetTitledFirstName] publicly questions the succession claim of the man I back, and demands I answer in court."
 ftr_court_struggle.0611.a:0 "Accept: I will meet him in the hall."
 ftr_court_debate_accept_tt:0 "Accept the debate: both sides will be judged on learning and wit before the court. The winner and those he backs gain prestige and influence; the loser bears an extra loss."
 ftr_court_struggle.0611.b:0 "Decline: I will not stoop to it."
 ftr_court_struggle.0612.t:0 "Debate Before the Court"
 ftr_court_struggle.0612.desc_win:0 "After the exchanges, [ftr_court_debate_rival.GetTitledFirstName] was left without an argument, and my voice carried the hall."
 ftr_court_struggle.0612.desc_lose:0 "After the exchanges, [ftr_court_debate_rival.GetTitledFirstName] left me speechless, and I lost face before the court."
 ftr_court_struggle.0612.a:0 "The court is dismissed."
 ftr_court_debate_settle_tt:0 "The debate is decided: the winner and those he backs take prestige (and influence in administrative realms), while the loser bears an extra loss — and the dispute heats up."
 ftr_court_debate_notify_win_title:0 "Debate Won"
 ftr_court_debate_notify_win_desc:0 "Before the court I out-argued [ftr_court_debate_challenger.GetTitledFirstName], and prestige and influence followed."
 ftr_court_debate_notify_lose_title:0 "Debate Lost"
 ftr_court_debate_notify_lose_desc:0 "In open court I had no answer to [ftr_court_debate_challenger.GetTitledFirstName], and lost face for it."
 ftr_court_debate_notify_dodge_title:0 "Challenge Unanswered"
 ftr_court_debate_notify_dodge_desc:0 "[ftr_court_debate_rival.GetTitledFirstName] shied away from my challenge in open court, and lost standing for it."

###### 0600 / 0601 Impeachment (M1, civil strife) ######
 ftr_court_struggle.0600.t:0 "An Impeachment Proposed"
 ftr_court_struggle.0600.desc:0 "Whispers run through the hall: [ftr_court_impeach_target.GetTitledFirstName] sits on the council yet cannot carry its burdens. With such talk abroad, the moment is ripe to lodge a formal impeachment."
 ftr_court_struggle.0600.a:0 "Lodge the impeachment and let the liege judge."
 ftr_court_struggle.0600.b:0 "Let it rest — someone must hold the seat."
 ftr_court_impeach_petition_tt:0 "Send this petition to your top liege — he will decide how to settle it."
 ftr_court_struggle.0601.t:0 "A Petition of Impeachment"
 ftr_court_struggle.0601.opening:0 "[sender.GetTitledFirstName] petitions against [ftr_court_impeach_target.GetTitledFirstName], claiming the councillor is unfit for office and long on the council without result."
 ftr_court_struggle.0601.a:0 "Grant it: strip them of the council seat."
 ftr_court_impeach_grant_tt:0 "Dismiss them from the council. This costs you prestige; the petitioner and the accused become bitter foes (possibly rivals); the petitioner's camp credits you with justice while the accused's camp resents you; and the dispute will sharply inflame the court — possibly igniting open strife."
 ftr_court_struggle.0601.b:0 "Sit on it: preserve the council's dignity."
 ftr_court_impeach_refuse_tt:0 "Reject the petition. This costs you prestige; the petitioner and the accused become bitter foes (possibly rivals); the accused's camp credits you with protection while the petitioner's camp resents you; the dispute heats up."
 ftr_court_struggle.0601.c:0 "Mediate personally: scold both sides."
 ftr_court_impeach_quell_tt:0 "You step in: each side saves a little face, the quarrel is shelved for now and the court cools (intensity falls); but mediation costs you prestige, and neither side will be truly satisfied."
 ftr_court_struggle.0601.d:0 "Mutter something vague and postpone."

###### 0300-0360 Slander-and-poison chain (§12.4.2 means 2.1)######
 ftr_court_struggle.0300.t:0 "A Rumour Sharp as a Blade"
 ftr_court_struggle.0300.desc:0 "The struggle over the throne has turned to shadows. [ROOT.Char.GetTitledFirstName] decides to strike first, sending trusted agents to spread tales of embezzlement and disloyalty about [scope:ftr_court_victim.GetFullName] throughout the court."
 ftr_court_struggle.0300.a:0 "Spread the rumour and tarnish their name."
 ftr_court_struggle.0300.b:0 "The stakes are too high — hold my tongue."
 ftr_court_struggle.0310.t:0 "Forged Evidence"
 ftr_court_struggle.0310.desc:0 "[ROOT.Char.GetTitledFirstName] has forged irrefutable 'proof' of [scope:ftr_court_victim.GetFullName]'s embezzlement, and lays it before the throne. Should the sovereign believe it, [scope:ftr_court_victim.GetFullName]'s name will be ruined."
 ftr_court_struggle.0310.a:0 "Present the forgery against [scope:ftr_court_victim.GetFullName]."
 ftr_court_struggle.0310.b:0 "Heaven would not abide it — I withdraw."
 ftr_court_struggle.0320.t:0 "Poison in the Cup"
 ftr_court_struggle.0320.desc:0 "A step in the dark. [ROOT.Char.GetTitledFirstName] has acquired a lethal poison. In a single breath one could end [scope:ftr_court_victim.GetFullName]'s bid for the throne — or their life."
 ftr_court_struggle.0320.a:0 "Slip them the killing dose."
 ftr_court_struggle.0320.b:0 "Administer a slow poison that leaves them bedridden."
 ftr_court_struggle.0320.c:0 "I cannot bring myself to do it."
 ftr_court_struggle.0330.t:0 "Word Leaks Out"
 ftr_court_struggle.0330.desc:0 "[ROOT.Char.GetTitledFirstName] learns that [scope:ftr_court_actor.GetFullName] has been spreading slander against them at court. Without a riposte, their standing will collapse."
 ftr_court_struggle.0330.a:0 "Fight fire with fire."
 ftr_court_struggle.0330.b:0 "A clear conscience needs no defence — bear it."
 ftr_court_struggle.0340.t:0 "The Charge of Corruption"
 ftr_court_struggle.0340.desc:0 "[ROOT.Char.GetTitledFirstName] stands accused of embezzlement. The evidence is forged, yet it rests squarely before [ftr_court_arbiter.GetTitledFirstName] — unless one can plead innocence convincingly."
 ftr_court_struggle.0340.a:0 "Protest my innocence at length."
 ftr_court_struggle.0340.b:0 "Say nothing and weather the scandal."
 ftr_court_struggle.0350.t:0 "The Poison Takes Hold"
 ftr_court_struggle.0350.desc:0 "A searing pain tears through [ROOT.Char.GetTitledFirstName]'s gut. Poisoned — but by which rival at court?"
 ftr_court_struggle.0350.a:0 "Summon the physicians!"
 ftr_court_struggle.0360.t:0 "Waxing Weak"
 ftr_court_struggle.0360.desc:0 "[ROOT.Char.GetTitledFirstName] has lately felt dizzy and listless. Something slow in the food seems to be sapping their strength day by day."
 ftr_court_struggle.0360.a:0 "I must investigate the household stores."
 ftr_court_struggle.0370.t:0 "The Rumour War Escalates"
 ftr_court_struggle.0370.desc:0 "Rumours spread like wildfire. [ROOT.Char.GetTitledFirstName] and [ftr_court_actor.GetTitledFirstName] trade ever harsher slanders while the whole court watches. Escalate until both are dragged down, or step back?"
 ftr_court_struggle.0370.a:0 "Fight fire with fire."
 ftr_court_struggle.0370.b:0 "Lower the swords and keep low."
 ftr_court_struggle.0401.t:0 "The Forger Is Unmasked"
 ftr_court_struggle.0401.desc:0 "Close inquiry reveals the evidence was forged by [ftr_court_inq_actor.GetTitledFirstName] — [ftr_court_inq_victim.GetTitledFirstName] stands vindicated. How should the slanderer be dealt with?"
 ftr_court_struggle.0401.a:0 "Imprison the forger as a warning."
 ftr_court_struggle.0401.b:0 "Reprimand them publicly."
 ftr_court_struggle.0401.c:0 "Let it go — vengeance begets vengeance."
 ftr_court_struggle.0390.t:0 "Hunt the Poisoner"
 ftr_court_struggle.0390.desc:0 "After the poisoning, [ROOT.Char.GetTitledFirstName] turns it over — the cup, the strange dish, all point toward [ftr_court_actor.GetTitledFirstName]. Keep pressing the matter, or swallow the insult?"
 ftr_court_struggle.0390.a:0 "I will not rest until this is settled!"
 ftr_court_struggle.0390.b:0 "Without proof, I can only bear it."

###### 0400 Spymaster's eye / 0430 Murder (means 2.2 / 2.5)######
 ftr_court_struggle.0400.t:0 "The Spymaster's Eye"
 ftr_court_struggle.0400.desc:0 "As the intrigues at court grow ever hotter, [ROOT.Char.GetTitledFirstName] resolves to send one's ablest agents to investigate the most prominent claimant and see what leverage might be found against them."
 ftr_court_struggle.0400.a:0 "Investigate and expose their misdeeds openly."
 ftr_court_struggle.0400.b:0 "Know the enemy, but bide my time."
 ftr_court_struggle.0430.t:0 "The Assassin's Plot"
 ftr_court_struggle.0430.desc:0 "[ROOT.Char.GetTitledFirstName]'s contest for the throne with [scope:ftr_court_victim.GetFullName] has become mortal. Rather than fall honourably, [ROOT.Char.GetTitledFirstName] muses on hiring cutthroats to make the rival no longer a concern."
 ftr_court_struggle.0430.a:0 "Hire assassins to end their life."
 ftr_court_struggle.0430.b:0 "Fall back on finding some leverage instead."
 ftr_court_struggle.0430.c:0 "The blade cuts both ways — I will not."

###### 0410 Leverage / 0420 Abduction (means 2.3 / 2.4)######
 ftr_court_struggle.0410.t:0 "A Secret in Hand"
 ftr_court_struggle.0410.desc:0 "Years of building connections now bear fruit: a trusted agent has uncovered something [scope:ftr_court_victim.GetFullName] would sooner keep hidden. Use it to extort quietly, or expose it to shame them openly?"
 ftr_court_struggle.0410.a:0 "Seize the leverage and extort in private."
 ftr_court_struggle.0410.b:0 "Expose it openly and humble them."
 ftr_court_struggle.0420.t:0 "Taken in the Night"
 ftr_court_struggle.0420.desc:0 "The contest can no longer be won by courtly manoeuvre alone. [ROOT.Char.GetTitledFirstName] hires a band of cutthroats to seize [scope:ftr_court_victim.GetFullName] by night, so the rival may feel a blade at their throat."
 ftr_court_struggle.0420.a:0 "Seize them and force a concession."
 ftr_court_struggle.0420.b:0 "Frighten them and let them go."
 ftr_court_struggle.0420.c:0 "Abduction offends heaven — I desist."
 ftr_court_struggle.0411.t:0 "Leverage Bites"
 ftr_court_struggle.0411.desc:0 "The secret in [ROOT.Char.GetTitledFirstName]'s hand cuts like a blade — [ftr_court_leverage_holder_victim.GetTitledFirstName]'s fate hangs on your whim. Press for gain, or burn the bridges openly?"
 ftr_court_struggle.0411.a:0 "Press them into yielding for real gain."
 ftr_court_struggle.0411.b:0 "Expose them and ruin their name."
 ftr_court_struggle.0411.c:0 "Return the secret for goodwill."
 ftr_court_struggle.0412.t:0 "Bitten Back"
 ftr_court_struggle.0412.desc:0 "[ftr_court_leverage_holder_victim.GetTitledFirstName] is no easy prey — the leverage you thought secure was turned against you before the whole court."
 ftr_court_struggle.0412.a:0 "A formidable opponent... I must swallow this."
 ftr_court_struggle.0421.t:0 "A Knife at the Throat"
 ftr_court_struggle.0421.desc:0 "After a night of terror, [ROOT.Char.GetTitledFirstName] at last sees who holds the knife — [ftr_court_actor.GetTitledFirstName]. Yield and withdraw, defy them unto death, or plot a return blow?"
 ftr_court_struggle.0421.a:0 "Better to live — yield and step back."
 ftr_court_struggle.0421.b:0 "Death before dishonour!"
 ftr_court_struggle.0421.c:0 "This insult will be repaid a hundredfold."
 ftr_court_struggle.0422.t:0 "The Counterstroke Lands"
 ftr_court_struggle.0422.desc:0 "[ftr_court_victim.GetTitledFirstName]'s revenge is swift and sharp — your abduction has been exposed, and the court looks on with contempt."
 ftr_court_struggle.0422.a:0 "One misstep after another..."
 ftr_court_struggle.0500.t:0 "Whispers in the Dark"
 ftr_court_struggle.0500.desc:0 "The co-ruler's power swells, and [ROOT.Char.GetTitledFirstName], holding no land, must work in shadow — sounding out courtiers who resent the co-ruler and poisoning the monarch's ear."
 ftr_court_struggle.0500.a:0 "Spread whispers to weaken the co-ruler."
 ftr_court_struggle.0500.b:0 "Buy off the co-ruler's circle and plot slowly."
 ftr_court_struggle.0500.c:0 "The hour is not ripe — endure for now."
 ftr_court_struggle.0510.t:0 "The Co-Ruler Strikes Back"
 ftr_court_struggle.0510.desc:0 "The loyalists press hard, and [ROOT.Char.GetTitledFirstName]'s position as co-ruler hangs by a thread. Order trusted allies to lobby at court, or lie low?"
 ftr_court_struggle.0510.a:0 "Dispatch allies to win back hearts."
 ftr_court_struggle.0510.b:0 "Bide my time for a better day."

###### 0520 / 0530 Backer demand (§14) ######
 ftr_court_struggle.0520.t:0 "The Faction Comes Calling"
 ftr_court_struggle.0520.desc:0 "The magnates who have tied their fortunes to [ftr_court_demand_champion.GetTitledFirstName] no longer trouble to hide their numbers. They come to court as a single body and demand — politely, but with their retinues at their backs — that their champion be raised to share the throne with [ROOT.Char.GetTitledFirstName]."
 ftr_court_struggle.0520.a:0 "Very well. Let them share the burden."
 ftr_court_struggle.0520.b:0 "The Crown does not bow to a faction. Refused."
 ftr_court_struggle.0530.t:0 "The Co-Ruler Comes to Collect"
 ftr_court_struggle.0530.desc:0 "The partisans of [ftr_court_demand_diarch.GetTitledFirstName] have grown too many and too bold. With the balance of power wholly theirs, they come not to ask but to tell: the co-ruler will take up the crown, and [ROOT.Char.GetTitledFirstName] will step down — quietly, or otherwise."
 ftr_court_struggle.0530.a:0 "So be it. I will not cling to a lost crown."
 ftr_court_struggle.0530.b:0 "I will not yield. Let them take it by force."

###### 0999 DEBUG list claimants (ftr_court_debug_report_claimants_decision) ######
 ftr_court_struggle.0999.t:0 "[DEBUG] Court Claimants Overview"
 ftr_court_struggle.0999.desc:0 "List each current claimant and their number of supporters. Hover over the option below to view the list."
 ftr_court_struggle.0999.a:0 "View List"
 ftr_court_struggle.0999.b:0 "Close"


