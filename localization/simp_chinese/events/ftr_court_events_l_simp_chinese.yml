l_simp_chinese:

 ###### 0003 对立 ######
 ftr_court_struggle.0003.t:0 "天无二日"
 ftr_court_struggle.0003.desc:0 "朝堂已经分裂。如今每一次任命都被人解读为风向，每一次冷落都被视作宣战。竞争者互相盯着——也在盯着我。"
 ftr_court_struggle.0003.a:0 "让他们互相消耗去吧。"
 ftr_court_struggle.0003.b:0 "我将扶持声势最盛的那个。"
 ftr_court_struggle.0003.c:0 "够了。我禁止这等内斗。"

 ###### 0004 危机 ######
 ftr_court_struggle.0004.t:0 "刀锋之上"
 ftr_court_struggle.0004.desc:0 "事情已经不止于窃窃私语。望族之间信使往来不绝，其中不止一人所持的印信并非出自我的授意。我若不动手，自有人会动手。"
 ftr_court_struggle.0004.a:0 "继位之事自会有个了断。"
 ftr_court_struggle.0004.b:0 "我必须现在就立储。"
 ftr_court_struggle.0004.c:0 "揪出为首之人，予以痛击。"

 ###### 0100 老君王的命运 ######
 ftr_court_struggle.0100.t:0 "废黜之君"
 ftr_court_struggle.0100.desc:0 "[ftr_court_old_monarch.GetFullName]如今坐在我曾经下跪的位置上。举国屏息，看我将如何处置这顶坠落的后冠。"
 ftr_court_struggle.0100.a:0 "软禁即可，留他性命。"
 ftr_court_struggle.0100.b:0 "投入地牢，让他好生体会其中分量。"
 ftr_court_struggle.0100.c:0 "坠落的后冠，留着颈上人头何用。"

 ###### 0110 其余竞争者 ######
 ftr_court_struggle.0110.t:0 "其余皇子"
 ftr_court_struggle.0110.desc:0 "还有其他人，流着同样的血，怀着同样的指望。有的很快跪了，有的却始终不肯低头。"
 ftr_court_struggle.0110.a:0 "赦免他们，并兑现我的许诺。"
 ftr_court_struggle.0110.b:0 "擒贼先擒王——拿下威胁最大的那个对手。"
 ftr_court_struggle.0110.c:0 "让他们保留封地，我会盯着他们。"

 ###### 0120 竞争者的抉择 ######
 ftr_court_struggle.0120.t:0 "屈膝，还是起兵"
 ftr_court_struggle.0120.desc:0 "[ftr_court_new_monarch.GetFullName]头戴的那顶冠冕，论理本该是我的。我麾下的兵马仍听我号令。问题只在于，我敢不敢。"
 ftr_court_struggle.0120.a:0 "决不。我要以武力主张我的权利。"
 ftr_court_struggle.0120.b:0 "忍辱负重，屈膝称臣。"

 ###### 0130 处置叛乱者 ######
 ftr_court_struggle.0130.t:0 "阶下之囚"
 ftr_court_struggle.0130.desc:0 "[ftr_court_warleader.GetFullName]押上一切来赌我的王冠，结果输了个精光。继承之名已从名册上抹去，叛旗已被践碎，叛乱者如今跪在我的地牢里。剩下的，是决定这份「忠心」究竟值多少。"
 ftr_court_struggle.0130.a:0 "让他在地牢里了此残生。"
 ftr_court_struggle.0130.b:0 "将他们逐出国境。"
 ftr_court_struggle.0130.c:0 "杀一儆百。"
 ftr_court_struggle.0130.d:0 "他已经失去得够多了。"

 ###### 0016 内阁承诺首次提醒 ######
 ftr_court_struggle.0016.t:0 "欠下的席位"
 ftr_court_struggle.0016.desc:0 "王冠已落到[ROOT.Char.GetTitledFirstNamePossessive]头上，随之一同而来的，还有通往大位路上一笔笔许下的承诺。[ftr_court_promised_vassal.GetFullName]当年出力扶持，换的是一个内阁席位。满朝文武都在看着，这些话究竟算不算数。"
 ftr_court_struggle.0016.a:0 "一诺千金，授职。"
 ftr_court_struggle.0016.b:0 "时机未到，容后再议。"

 ###### 0017 内阁承诺终裁 ######
 ftr_court_struggle.0017.t:0 "耐心耗尽"
 ftr_court_struggle.0017.desc:0 "[ftr_court_promised_vassal.GetFullName]已经等得够久了。自那日许下内阁席位，数月过去，职位却始终没有着落。今日，他们要一个明确的答复——满朝文武，同样在看。"
 ftr_court_struggle.0017.a:0 "罢了，授职。"
 ftr_court_struggle.0017.b:0 "王冠不欠任何人。驳回。"

 ###### 0150 废黜昏君 ######
 ftr_court_struggle.0150.t:0 "提线在手"
 ftr_court_struggle.0150.desc:0 "[ftr_court_monarch.GetTitledFirstName]在别人递来的任何文书上盖印，近来每一道诏令都带着我的指纹。满朝向我鞠躬，只是名义上跪在他们面前。一切只差一步——而且不会有人哀悼。"
 ftr_court_struggle.0150.a:0 "提线在手，何不连龙椅一起拿过来？"
 ftr_court_struggle.0150.b:0 "提线已经够了——暂时。"

 ###### 0001 朝堂权力角逐开始 ######
 ftr_court_struggle.0001.t:0 "继位之争，就此拉开帷幕"
 ftr_court_struggle.0001.desc:0 "继承问题已经有了答案——不，不是答案，而是被重新抛向风口浪尖。在[ftr_court_monarch.GetTitledFirstName]周围，竞争者虎视眈眈，内阁成员各自选边。朝堂上的权力角逐已经开始，每一个有权势的人都必须决定自己的立场归于何处。"
 ftr_court_struggle.0001.a:0 "我会密切关注这股权力潮汐。"

###### 0002 朝堂权力角逐落幕 ######
 ftr_court_struggle.0002.t:0 "尘埃落定"
 ftr_court_struggle.0002.desc:0 "围绕[ftr_court_monarch.GetTitledFirstName]的那场权力角逐已落下帷幕。朝堂上唇枪舌剑的纷争止息，暗流也随之平息。有人如愿以偿，有人黯然退场，更多的人只是长舒一口气——这场博弈终于有了结果。"
 ftr_court_struggle.0002.a:0 "一切终于归于平静。"

 ###### 0200 朝堂站队 ######
 ftr_court_struggle.0200.t:0 "择主而事"
 ftr_court_struggle.0200.desc:0 "朝堂正在悄然分化，中立正成为最危险的立场。是时候决定该追随哪颗星了。"
 ftr_court_struggle.0200.a:0 "拥立[ftr_court_claimant_1.GetFullName]"
 ftr_court_struggle.0200.b:0 "拥立[ftr_court_claimant_2.GetFullName]"
 ftr_court_struggle.0200.c:0 "拥立[ftr_court_claimant_3.GetFullName]"
 ftr_court_struggle.0200.d:0 "拥立[ftr_court_claimant_4.GetFullName]"
 ftr_court_struggle.0200.e:0 "拥立[ftr_court_claimant_5.GetFullName]"
 ftr_court_struggle.0200.f:0 "静观其变。"
 ftr_court_struggle.0200.g:0 "宣誓效忠[ftr_court_monarch.GetTitledFirstName]"
 ftr_court_struggle.0200.h:0 "拥戴共治者[ftr_court_diarch.GetTitledFirstName]"
 ftr_court_apply_backing_effect.liege_notify_text:0 "此举可能引起最高领主的警觉与不满"
 ftr_court_struggle.0200.offer_back_tt:0 "向对方提出公开拥立，等待其答复。若对方接受，则正式建立公开背书、双方互相提升好感，但其余竞争者会心生芥蒂，君主也可能因此警觉；若对方拒绝，则双方关系交恶。"

 ###### 0210 拥立需得首肯 ######
 ftr_court_struggle.0210.t:0 "有人愿执旗前驱"
 ftr_court_struggle.0210.desc:0 "[ftr_court_offerer.GetTitledFirstName]来到面前，言辞恳切地表示愿公开拥立[ROOT.Char.GetTitledFirstName]登上大位。这份站队是助力，也可能招来非议——是否接受，全看[ROOT.Char.GetFirstName]一念。"
 ftr_court_struggle.0210.desc_monarch:0 "[ftr_court_offerer.GetTitledFirstName]来到面前，言辞恳切地宣誓效忠，愿在朝堂上为陛下执旗前驱。这份站队是助力，也可能招来非议——是否接受，全看[ROOT.Char.GetFirstName]一念。"
 ftr_court_struggle.0210.desc_diarch:0 "[ftr_court_offerer.GetTitledFirstName]来到面前，愿公开拥戴[ROOT.Char.GetTitledFirstName]，为其党羽。此举既可为助力，也可能令君主侧目——是否接纳，全看[ROOT.Char.GetFirstName]一念。"
 ftr_court_struggle.0210.a:0 "愿意收下这份拥立。"
 ftr_court_struggle.0210.b:0 "不必了，我不需要公开站队。"
 ftr_court_struggle.0210.accept_notify:0 "你的拥立被接受了"
 ftr_court_struggle.0210.refuse_notify:0 "你的拥立被拒绝了"

 ###### 0140 竞争者抉择 ######
 ftr_court_struggle.0140.t:0 "良机已至"
 ftr_court_struggle.0140.desc:0 "支持者已经聚拢，积怨早已摆上台面，年迈的[ftr_court_monarch.GetTitledFirstName]一天弱过一天。众人都在等一个信号。此刻若再迟疑，他们便会转头去寻别人。"
 ftr_court_struggle.0140.a:0 "举旗起兵。"
 ftr_court_struggle.0140.b:0 "暗影中动手。"
 ftr_court_struggle.0140.c:0 "再等等，从长计议。"

 ###### 0220 共治请愿 ######
 ftr_court_struggle.0220.t:0 "请分国事之忧"
 ftr_court_struggle.0220.desc:0 "[actor.GetFullName]恭恭敬敬地跪下，以最谦卑的措辞奏请——将治国之重担分而担之。措辞无懈可击。正因如此，才最危险。"
 ftr_court_struggle.0220.a:0 "好吧。分忧就分忧。"
 ftr_court_struggle.0220.b:0 "君权不可与人分。驳回。"

 ###### 0230 是否参与继位角逐 ######
 ftr_court_struggle.0230.t:0 "是否参与角逐"
 ftr_court_struggle.0230.desc:0 "[ftr_court_monarch.GetTitledFirstName]年事已高，大位归属已被重新抛向风口浪尖。[ROOT.Char.GetFullName]是挺身而出、角逐大位，还是退居一旁，坐看他人相争？"
 ftr_court_struggle.0230.a:0 "我要角逐这大位。"
 ftr_court_struggle.0230.b:0 "这场角逐，我无意参与。"

###### 0601 弹劾裁决回执（M1） ######
 ftr_court_impeach_notify_grant_actor_title:0 "弹劾获准"
 ftr_court_impeach_notify_grant_actor_desc:0 "君上准了我的弹章，[ftr_court_impeach_target.GetTitledFirstName]已失内阁之职。"
 ftr_court_impeach_notify_grant_target_title:0 "遭褫夺"
 ftr_court_impeach_notify_grant_target_desc:0 "君上准了弹章，我的内阁之职被夺。"
 ftr_court_impeach_notify_refuse_actor_title:0 "弹章留中"
 ftr_court_impeach_notify_refuse_actor_desc:0 "君上把我的弹章留中不发，[ftr_court_impeach_target.GetTitledFirstName]安然无恙。"
 ftr_court_impeach_notify_refuse_target_title:0 "内阁得保"
 ftr_court_impeach_notify_refuse_target_desc:0 "弹章被留中不发，我的内阁之职得以保全。"
 ftr_court_impeach_notify_quell_title:0 "君上亲自调停"
 ftr_court_impeach_notify_quell_desc:0 "君上亲自出面调停，弹劾之事就此揭过。"
 ftr_court_impeach_notify_delay_title:0 "弹章含糊"
 ftr_court_impeach_notify_delay_desc:0 "君上含糊其辞，终究未作明断。"
 ftr_court_impeach_delay_tt:0 "含糊其辞：不作明断，弹劾者因此记恨君上，朝堂烈度小幅上浮。"
 ftr_court_debate_dodge_tt:0 "避战不应：我方声望受损，发起方因此看轻我；此事未了，朝堂烈度小幅上浮。"
 ftr_court_duel_settle_tt:0 "比武胜负已定：胜者声望大涨（+200），败者失势（−120）且其党羽离心；朝堂烈度小幅上浮。"
 ftr_court_appraisal_settle_tt:0 "定评已出：褒成则被评者按政体得功绩／影响力（余者折声望）且感我之情；贬成则其名声受损、与我结怨；评议失当则我方声望反噬。朝堂烈度小幅上浮。"
 ftr_court_omen_settle_tt:0 "勘验已毕：识破则造势者声望大损（−250）、朝廷声望小得；勘验无果则祥瑞坐实、造势者声望大涨，朝堂烈度明显上浮。"

###### 0620 / 0621 管辖纠纷・比武裁决（M4，文明争斗） ######
 ftr_court_struggle.0620.t:0 "御前裁断"
 ftr_court_struggle.0620.desc:0 "[ftr_court_duel_plaintiff.GetTitledFirstName]与[ftr_court_duel_defendant.GetTitledFirstName]为地界与管辖权争执不休，各自递上诉状，请我裁断。"
 ftr_court_struggle.0620.a:0 "命二人当廷比武，以胜负定曲直。"
 ftr_court_struggle.0620.b:0 "判[ftr_court_duel_plaintiff.GetTitledFirstName]得直。"
 ftr_court_struggle.0620.c:0 "判[ftr_court_duel_defendant.GetTitledFirstName]得直。"
 ftr_court_struggle.0620.d:0 "各打五十大板，暂不理会。"
 ftr_court_duel_combat_tt:0 "双方当廷角力，胜负由勇武与军事定夺；败者失势，其党羽亦随之离心。"
 ftr_court_duel_verdict_tt:0 "裁定一方得直：胜方声望小涨，败方失面并记恨胜者与君上。"
 ftr_court_duel_dismiss_tt:0 "置之不理：争端不解，双方皆对君上不满，朝堂烈度上浮。"
 ftr_court_duel_notify_verdict_win_title:0 "御前裁断：我得直"
 ftr_court_duel_notify_verdict_win_desc:0 "君上的裁断对我有利，这笔地界从此归我。"
 ftr_court_duel_notify_verdict_lose_title:0 "御前裁断：我失理"
 ftr_court_duel_notify_verdict_lose_desc:0 "君上的裁断不利于我。眼前这笔账，我记下了。"
 ftr_court_duel_notify_dismissed_title:0 "争端未获受理"
 ftr_court_duel_notify_dismissed_desc:0 "君上把我的诉状搁下了，既不裁断，也不安抚。"
 ftr_court_struggle.0621.t:0 "当廷比武"
 ftr_court_struggle.0621.desc_plaintiff:0 "当廷交手，[ftr_court_duel_plaintiff.GetTitledFirstName]将[ftr_court_duel_defendant.GetTitledFirstName]击倒在地，曲直由此分明。"
 ftr_court_struggle.0621.desc_defendant:0 "当廷交手，[ftr_court_duel_defendant.GetTitledFirstName]力挫[ftr_court_duel_plaintiff.GetTitledFirstName]，原告当众受挫。"
 ftr_court_struggle.0621.a:0 "退朝。"
 ftr_court_duel_notify_win_title:0 "比武得胜"
 ftr_court_duel_notify_win_desc:0 "当着朝堂，我在角力中胜出，声名更盛。"
 ftr_court_duel_notify_lose_title:0 "比武落败"
 ftr_court_duel_notify_lose_desc:0 "我在当廷比武中输了一场，声望与追随皆有折损。"

###### 0630 / 0631 清议 / 月旦评（M5，文明争斗） ######
 ftr_court_struggle.0630.t:0 "月旦评"
 ftr_court_struggle.0630.desc:0 "士林之间，人物品第全凭一支笔。[ftr_court_appraisal_target.GetTitledFirstName]的言行尽在我眼中——我的一句话，可令他名重一时，也可令他声名扫地。"
 ftr_court_struggle.0630.a:0 "褒而扬之：抬其名位，结其欢心。"
 ftr_court_struggle.0630.b:0 "清议贬之：评其品行不堪。"
 ftr_court_struggle.0630.c:0 "此事与我无关。"
 ftr_court_appraisal_praise_tt:0 "为其作好评：成则其人按政体得功绩／影响力（余者折声望），并感我之情；评议失当则我方声望反噬。"
 ftr_court_appraisal_smear_tt:0 "为其作恶评：成则其人声望受损、与我结怨，朝堂烈度上浮；评议失当则我方声望反噬。"
 ftr_court_struggle.0631.t:0 "当众定评"
 ftr_court_struggle.0631.desc_praise:0 "我在士人聚会中称许[ftr_court_appraisal_target.GetTitledFirstName]，众人附和，其人名位由是更重。"
 ftr_court_struggle.0631.desc_smear:0 "我当众评断[ftr_court_appraisal_target.GetTitledFirstName]品行不堪，士林议论纷纷，其人声名大损。"
 ftr_court_struggle.0631.desc_backfire:0 "我的评断无人肯信，反被指为挟私论人，声望自损。"
 ftr_court_struggle.0631.a:0 "由他们说去。"
 ftr_court_appraisal_notify_praised_title:0 "士林称许"
 ftr_court_appraisal_notify_praised_desc:0 "[ftr_court_appraisal_actor.GetTitledFirstName]在士人之间为我扬名，名位与实惠随之而来。"
 ftr_court_appraisal_notify_smeared_title:0 "士林非议"
 ftr_court_appraisal_notify_smeared_desc:0 "[ftr_court_appraisal_actor.GetTitledFirstName]当众评我品行不堪，声名受损。"
 ftr_court_appraisal_notify_backfire_title:0 "评议反噬"
 ftr_court_appraisal_notify_backfire_desc:0 "[ftr_court_appraisal_actor.GetTitledFirstName]想借清议贬我，却无人肯信，反自损其望。"

###### 0640 / 0641 祥瑞上奏・天象勘验（M6，文明争斗） ######
 ftr_court_struggle.0640.t:0 "祥瑞上奏"
 ftr_court_struggle.0640.desc:0 "[ftr_court_omen_faker.GetTitledFirstName]上奏祥瑞，言天象示吉，请朝廷昭告。是真受命于天，还是党羽借势造声？"
 ftr_court_struggle.0640.a:0 "嘉奖其瑞，昭告天下。"
 ftr_court_struggle.0640.b:0 "遣学者勘验。"
 ftr_court_struggle.0640.c:0 "置之不理。"
 ftr_court_omen_endorse_tt:0 "认可祥瑞：其人声望大涨，其党羽借势坐大，朝堂烈度上浮。"
 ftr_court_omen_inquiry_tt:0 "遣学者勘验：识破则其人声望大损、朝廷声望小得；勘验无果则祥瑞坐实，其人声望大涨且烈度显著上浮。"
 ftr_court_omen_ignore_tt:0 "置之不理：既不认可也不勘验，谣言自会长成定论，朝堂烈度明显上浮。"
 ftr_court_struggle.0641.t:0 "天象勘验"
 ftr_court_struggle.0641.desc_debunked:0 "学者细勘星象与物证，[ftr_court_omen_faker.GetTitledFirstName]所称祥瑞全然造作，朝堂哗然。"
 ftr_court_struggle.0641.desc_upheld:0 "学者反复勘验，终不能指其伪；[ftr_court_omen_faker.GetTitledFirstName]的祥瑞反而就此坐实。"
 ftr_court_struggle.0641.a:0 "就此了结。"
 ftr_court_omen_notify_endorsed_title:0 "朝廷认可祥瑞"
 ftr_court_omen_notify_endorsed_desc:0 "我所奏祥瑞为朝廷所纳，声望大涨。"
 ftr_court_omen_notify_debunked_title:0 "祥瑞被识破"
 ftr_court_omen_notify_debunked_desc:0 "学者勘验之下，我所奏祥瑞被指为造作，声望大损。"
 ftr_court_omen_notify_survived_title:0 "祥瑞坐实"
 ftr_court_omen_notify_survived_desc:0 "勘验未能证伪，我的祥瑞反而就此坐实，声望大涨。"
 ftr_court_omen_notify_ignored_title:0 "祥瑞无人过问"
 ftr_court_omen_notify_ignored_desc:0 "朝廷对我的祥瑞既不认可也不勘验，任其自行发酵。"

###### 0610–0612 朝堂论战（M2/M3，文明争斗） ######
 ftr_court_struggle.0610.t:0 "朝堂论战"
 ftr_court_struggle.0610.desc_stance:0 "同为朝臣，[ftr_court_debate_rival.GetTitledFirstName]的立场与我格格不入。与其任由其主张在朝中坐大，不如当众请他一辩。"
 ftr_court_struggle.0610.desc_claim:0 "关于[ftr_court_debate_subject.GetTitledFirstName]的继承名分，[ftr_court_debate_rival.GetTitledFirstName]一味鼓吹，我却以为名不正言不顺。此事可以当廷辩论。"
 ftr_court_struggle.0610.a:0 "当廷发难，请其一辩。"
 ftr_court_struggle.0610.b:0 "不必与他争这一时口舌。"
 ftr_court_debate_challenge_tt:0 "向对方发出辩论之邀。他将决定是否应战：应战则当廷以学识与辩才分高下。"
 ftr_court_struggle.0611.t:0 "辩论之邀"
 ftr_court_struggle.0611.desc_stance:0 "[ftr_court_debate_challenger.GetTitledFirstName]当众请我就朝政立场一辩，言辞之间尽是挑衅。"
 ftr_court_struggle.0611.desc_claim:0 "[ftr_court_debate_challenger.GetTitledFirstName]当众质疑我所拥护者的继承名分，请我当廷答辩。"
 ftr_court_struggle.0611.a:0 "应战：朝会上见。"
 ftr_court_debate_accept_tt:0 "应下这场辩论：双方将当廷以学识与辩才较量，胜者与其拥护者同获声望与影响力，败者蒙受额外损失。"
 ftr_court_struggle.0611.b:0 "避战：不与他一般见识。"
 ftr_court_struggle.0612.t:0 "当廷论辩"
 ftr_court_struggle.0612.desc_win:0 "一番交锋之后，[ftr_court_debate_rival.GetTitledFirstName]词穷理屈，朝堂之上我的声音压过了他。"
 ftr_court_struggle.0612.desc_lose:0 "一番交锋之后，我竟被[ftr_court_debate_rival.GetTitledFirstName]驳得哑口无言，朝堂之上颜面尽失。"
 ftr_court_struggle.0612.a:0 "退朝。"
 ftr_court_debate_settle_tt:0 "辩论胜负已定：胜者及其拥护者各得声望（行政制另加影响力），败者额外损失；朝堂争端随之升温。"
 ftr_court_debate_notify_win_title:0 "论战胜出"
 ftr_court_debate_notify_win_desc:0 "当廷交锋之后，我以言辞压过了[ftr_court_debate_challenger.GetTitledFirstName]，声望与影响力随之而来。"
 ftr_court_debate_notify_lose_title:0 "论战落败"
 ftr_court_debate_notify_lose_desc:0 "朝堂之上，我终究不敌[ftr_court_debate_challenger.GetTitledFirstName]，颜面受损。"
 ftr_court_debate_notify_dodge_title:0 "挑战无人应"
 ftr_court_debate_notify_dodge_desc:0 "[ftr_court_debate_rival.GetTitledFirstName]避开了我在朝会上的挑战，其声望因此受损。"

###### 0600 / 0601 弹劾内阁（M1，文明争斗） ######
 ftr_court_struggle.0600.t:0 "弹劾之议"
 ftr_court_struggle.0600.desc:0 "朝中有人窃议：[ftr_court_impeach_target.GetTitledFirstName]身居内阁却难当其任。风声既起，正是具疏弹劾、以正视听之时。"
 ftr_court_struggle.0600.a:0 "具疏弹劾，请君上明断。"
 ftr_court_struggle.0600.b:0 "罢了，权当其位无人。"
 ftr_court_impeach_petition_tt:0 "把这桩弹劾奏疏递到最高领主案前——他将决定如何处置。"
 ftr_court_struggle.0601.t:0 "弹劾奏疏"
 ftr_court_struggle.0601.opening:0 "[sender.GetTitledFirstName]上书弹劾[ftr_court_impeach_target.GetTitledFirstName]，称其才不配位、久据内阁而无功。"
 ftr_court_struggle.0601.a:0 "准奏：褫夺其内阁之职。"
 ftr_court_impeach_grant_tt:0 "将其逐出内阁。此举耗损你的威望；弹劾者与被弹劾者自此反目（可能结为仇敌）；弹劾者阵营感念你主持公道，被弹劾者阵营则记恨；朝堂争端将骤然升温，甚至可能引爆公开倾轧。"
 ftr_court_struggle.0601.b:0 "留中不发，维持内阁体面。"
 ftr_court_impeach_refuse_tt:0 "驳回弹劾。此举耗损你的威望；弹劾者与被弹劾者自此反目（可能结为仇敌）；被弹劾者阵营感念你回护，弹劾者阵营则记恨；争端有所升温。"
 ftr_court_struggle.0601.c:0 "亲自调停：各打五十大板。"
 ftr_court_impeach_quell_tt:0 "由你出面平息：双方各得些许情面，争端暂时按下，朝堂气氛缓和（烈度下降）；但调停要花你的威望，且两边都不会真正满意。"
 ftr_court_struggle.0601.d:0 "含糊其辞，留待后议。"

###### 0300-0360 诬陷下毒链（§12.4.2 手段 2.1）######
 ftr_court_struggle.0300.t:0 "谣言如刃"
 ftr_court_struggle.0300.desc:0 "争夺大位的较量已转入暗处。[ROOT.Char.GetTitledFirstName]决定先发制人，命心腹在朝堂散布关于[scope:ftr_court_victim.GetFullName]贪墨、不忠的流言。是非曲直，只在人心。"
 ftr_court_struggle.0300.a:0 "传扬流言，中伤其声望。"
 ftr_court_struggle.0300.b:0 "兹事体大，暂且忍下。"
 ftr_court_struggle.0310.t:0 "作伪证以售其奸"
 ftr_court_struggle.0310.desc:0 "[ROOT.Char.GetTitledFirstName]伪造了一纸[scope:ftr_court_victim.GetFullName]贪墨公帑的"铁证"，趁其不备呈递御前。只要君主采信，[scope:ftr_court_victim.GetFullName]便声名扫地。"
 ftr_court_struggle.0310.a:0 "递上伪证，构陷[scope:ftr_court_victim.GetFullName]。"
 ftr_court_struggle.0310.b:0 "伪造之事终究瞒不过上天，作罢。"
 ftr_court_struggle.0320.t:0 "杯中之毒"
 ftr_court_struggle.0320.desc:0 "暗影中的一步。[ROOT.Char.GetTitledFirstName]得了一份见血封喉的毒药。一念之间，便可让[scope:ftr_court_victim.GetFullName]就此退出这场角逐——或永远消失。"
 ftr_court_struggle.0320.a:0 "下致命之毒。"
 ftr_court_struggle.0320.b:0 "下慢性毒药，使其缠绵病榻。"
 ftr_court_struggle.0320.c:0 "终究下不去手。"
 ftr_court_struggle.0330.t:0 "风声走漏"
 ftr_court_struggle.0330.desc:0 "[ROOT.Char.GetTitledFirstName]方知[scope:ftr_court_actor.GetFullName]在朝堂中散布流言中伤自己。若不设法还以颜色，威信恐将扫地。"
 ftr_court_struggle.0330.a:0 "以其人之道还治其人之身。"
 ftr_court_struggle.0330.b:0 "清者自清，暂且忍耐。"
 ftr_court_struggle.0340.t:0 "贪腐之罪"
 ftr_court_struggle.0340.desc:0 "[ROOT.Char.GetTitledFirstName]被卷入了贪墨公帑的指控。尽管那是伪造的，可证据确凿地摆在[ftr_court_arbiter.GetTitledFirstName]面前——除非能当庭自辩清白。"
 ftr_court_struggle.0340.a:0 "慷慨陈词，力辩清白。"
 ftr_court_struggle.0340.b:0 "人言可畏，索性缄默。"
 ftr_court_struggle.0350.t:0 "毒发"
 ftr_court_struggle.0350.desc:0 "一股撕裂脏腑的剧痛袭来。[ROOT.Char.GetTitledFirstName]意识到自己中了毒——是朝堂上的哪个对手下的手？"
 ftr_court_struggle.0350.a:0 "传太医！"
 ftr_court_struggle.0360.t:0 "日渐虚弱"
 ftr_court_struggle.0360.desc:0 "[ROOT.Char.GetTitledFirstName]近来头晕目眩、气力不济。饮食中似乎被掺了某种缓慢发作的毒物，教人日渐消沉。"
 ftr_court_struggle.0360.a:0 "须得彻查府中饮食。"
 ftr_court_struggle.0370.t:0 "舆论战升级"
 ftr_court_struggle.0370.desc:0 "流言如野火般蔓延。[ROOT.Char.GetTitledFirstName]与[ftr_court_actor.GetTitledFirstName]相互攻讦，朝堂上下议论纷纷。是继续以谣攻谣，把两人都拖下水，还是就此收手？"
 ftr_court_struggle.0370.a:0 "奉陪到底——以其人之道还治其人之身。"
 ftr_court_struggle.0370.b:0 "鸣金收兵，暂避锋芒。"
 ftr_court_struggle.0401.t:0 "伪造者伏法"
 ftr_court_struggle.0401.desc:0 "彻查之下，所谓证据实系[ftr_court_inq_actor.GetTitledFirstName]伪造——如今[ftr_court_inq_victim.GetTitledFirstName]清白已证，该当如何处置这个构陷者？"
 ftr_court_struggle.0401.a:0 "收押查办，以儆效尤。"
 ftr_court_struggle.0401.b:0 "当众斥责，削其颜面。"
 ftr_court_struggle.0401.c:0 "冤冤相报何时了，放他一马。"
 ftr_court_struggle.0390.t:0 "追凶"
 ftr_court_struggle.0390.desc:0 "中毒之后，[ROOT.Char.GetTitledFirstName]心思百转——那杯中的毒物、那盘中的异样，恐怕都与[ftr_court_actor.GetTitledFirstName]脱不了干系。要不要继续追查下去？"
 ftr_court_struggle.0390.a:0 "绝不罢休，追查到底！"
 ftr_court_struggle.0390.b:0 "无凭无据，只能咽下这口气。"

###### 0400 派间谍调查 / 0430 谋杀（手段 2.2 / 2.5）######
 ftr_court_struggle.0400.t:0 "密探之眼"
 ftr_court_struggle.0400.desc:0 "朝堂上明争暗斗愈演愈烈，[ROOT.Char.GetTitledFirstName]打算遣最精干的密探，暗中彻查那个风头最劲的竞争者，看他有无可被拿捏的把柄。"
 ftr_court_struggle.0400.a:0 "彻查并当众揭发其劣迹。"
 ftr_court_struggle.0400.b:0 "知己知彼亦可，暂且按兵不动。"
 ftr_court_struggle.0430.t:0 "行刺之谋"
 ftr_court_struggle.0430.desc:0 "[ROOT.Char.GetTitledFirstName]与[scope:ftr_court_victim.GetFullName]的争位已至不死不休。[ROOT.Char.GetTitledFirstName]盘算着，与其堂堂正正落败，不如雇几名亡命之徒，叫此人再也无法碍事。"
 ftr_court_struggle.0430.a:0 "收买刺客，取其性命。"
 ftr_court_struggle.0430.b:0 "退而求其次，寻个把柄拿捏他。"
 ftr_court_struggle.0430.c:0 "刀剑无眼，此事不可为。"

###### 0410 牵制 / 0420 绑架（手段 2.3 / 2.4）######
 ftr_court_struggle.0410.t:0 "把柄在握"
 ftr_court_struggle.0410.desc:0 "多年经营的人脉给[ROOT.Char.GetTitledFirstName]带来了回报：心腹探知了[scope:ftr_court_victim.GetFullName]一件见不得光的隐秘。是用它私下要挟，还是当众抖落，好叫此人颜面扫地？"
 ftr_court_struggle.0410.a:0 "握此把柄，私下要挟。"
 ftr_court_struggle.0410.b:0 "当众抖落，削其颜面。"
 ftr_court_struggle.0420.t:0 "夜半掳人"
 ftr_court_struggle.0420.desc:0 "胜负已不在一纸朝争之上。[ROOT.Char.GetTitledFirstName]雇了一队亡命之徒，欲趁夜将[scope:ftr_court_victim.GetFullName]掳走，教他尝尝被刀架在脖子上的滋味。"
 ftr_court_struggle.0420.a:0 "连夜将其掳走，逼其退让。"
 ftr_court_struggle.0420.b:0 "恐吓一番便放，取其胆寒。"
 ftr_court_struggle.0420.c:0 "掳人终究有干天和，作罢。"
 ftr_court_struggle.0411.t:0 "把柄生风"
 ftr_court_struggle.0411.desc:0 "[ROOT.Char.GetTitledFirstName]手中的把柄如刃在握——[ftr_court_leverage_holder_victim.GetTitledFirstName]的命脉攥在你的手心。是逼其让利，还是当众撕破脸皮？"
 ftr_court_struggle.0411.a:0 "借此逼其退让，谋取实利。"
 ftr_court_struggle.0411.b:0 "当众揭穿，叫此人名誉扫地。"
 ftr_court_struggle.0411.c:0 "把柄还他，换一份人情。"
 ftr_court_struggle.0412.t:0 "反咬一口"
 ftr_court_struggle.0412.desc:0 "[ftr_court_leverage_holder_victim.GetTitledFirstName]绝非任人拿捏之辈——你自以为得计的把柄，竟被此人当众拆穿，反将你一军。"
 ftr_court_struggle.0412.a:0 "好一个厉害角色……这口气只能咽下。"
 ftr_court_struggle.0421.t:0 "刀下之囚"
 ftr_court_struggle.0421.desc:0 "一夜惊魂后，[ROOT.Char.GetTitledFirstName]终于看清了眼前的人——[ftr_court_actor.GetTitledFirstName]的刀已架在脖子上。是屈服认栽、宁死不从，还是设法反扑？"
 ftr_court_struggle.0421.a:0 "留得青山在，认栽退让。"
 ftr_court_struggle.0421.b:0 "大丈夫可杀不可辱！"
 ftr_court_struggle.0421.c:0 "今日之辱，来日百倍奉还。"
 ftr_court_struggle.0422.t:0 "反扑落网"
 ftr_court_struggle.0422.desc:0 "[ftr_court_victim.GetTitledFirstName]的报复来得又快又狠——[ROOT.Char.GetTitledFirstName]掳人一事败露，朝堂上满是鄙夷的目光。"
 ftr_court_struggle.0422.a:0 "一步错，步步错……"
 ftr_court_struggle.0500.t:0 "暗中策动"
 ftr_court_struggle.0500.desc:0 "共治者权柄日盛，而[ROOT.Char.GetTitledFirstName]身无寸土，只能暗中行事——联络对共治者不满的朝臣，在君前吹冷风、下眼药。"
 ftr_court_struggle.0500.a:0 "暗中进言，削弱共治之势。"
 ftr_court_struggle.0500.b:0 "花钱收买共治者左右，徐徐图之。"
 ftr_court_struggle.0500.c:0 "时机未到，暂且隐忍。"
 ftr_court_struggle.0510.t:0 "共治者反击"
 ftr_court_struggle.0510.desc:0 "保皇党步步紧逼，[ROOT.Char.GetTitledFirstName]的共治地位摇摇欲坠。是命亲信在朝堂内外游说拉拢，还是暂且蛰伏？"
 ftr_court_struggle.0510.a:0 "密令亲信游说，把人心拉回来。"
 ftr_court_struggle.0510.b:0 "暂避锋芒，来日再战。"

###### 0520 / 0530 党羽逼宫（§14）######
 ftr_court_struggle.0520.t:0 "党羽逼宫"
 ftr_court_struggle.0520.desc:0 "那些将身家性命押在[ftr_court_demand_champion.GetTitledFirstName]身上的权贵，已不再掩饰自己的数目。他们结成一党来到朝堂，措辞恭敬，身后却是甲胄森然——他们要求让他们的拥立对象与[ROOT.Char.GetTitledFirstName]共享大位。"
 ftr_court_struggle.0520.a:0 "也罢。让他们分担忧责。"
 ftr_court_struggle.0520.b:0 "君权岂能向朋党低头。驳回。"
 ftr_court_struggle.0530.t:0 "共治者前来索取"
 ftr_court_struggle.0530.desc:0 "[ftr_court_demand_diarch.GetTitledFirstName]的党羽已多得数不清，也胆大得过了头。天平已彻底倒向他们，此番前来不是乞求，而是知会：共治者将接过冠冕，[ROOT.Char.GetTitledFirstName]则须退位——识趣也好，不识趣也罢。"
 ftr_court_struggle.0530.a:0 "就这样吧。我不必死死抱住一顶注定失去的冠冕。"
 ftr_court_struggle.0530.b:0 "我绝不退让——他们要夺，便动手来夺吧。"

###### 0999 DEBUG 查看竞争者名单（ftr_court_debug_report_claimants_decision）######
 ftr_court_struggle.0999.t:0 "【调试】朝堂竞争者一览"
 ftr_court_struggle.0999.desc:0 "逐行查看当前参与角逐的竞争者及其支持者人数。将鼠标移至下方选项查看名单。"
 ftr_court_struggle.0999.a:0 "查看名单"
 ftr_court_struggle.0999.b:0 "关闭"
