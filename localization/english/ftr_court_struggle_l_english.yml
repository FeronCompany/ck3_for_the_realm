 ###### Story Cycle ######
 ftr_court_struggle:0 "<FTR>Succession Struggle"
 ftr_court_struggle_desc:0 "The question of the throne has been thrown open. Claimants circle the Crown, the council chooses sides, and the balance between the monarch and the co-ruler shifts with every act of loyalty or betrayal."
 FTR_COURT_STRINGS:0 "The great and the powerful circle one another over the question of who shall inherit the realm."
 FTR_COURT_CLAIMANTS:0 "Claimants"
 FTR_COURT_CANDIDATE_COUNT:0 "Claimants"
 FTR_COURT_INTENSITY:0 "<FTR>Court Intensity"
 FTR_COURT_SWING:0 "Balance of Power"
 FTR_COURT_SWING_LOYAL:0 "The Crown Holds"
 FTR_COURT_SWING_DIARCH:0 "The Co-Ruler Rises"
 FTR_COURT_TEMP_DUCHY_NAME:0 "Pretender's Host"

 ###### Casus Belli ######
 ftr_civil_war:0 "<FTR>Succession Struggle"
 ftr_succession_war:0 "<FTR>War of Succession"
 ftr_succession_war_desc:0 "[ROOT.GetFullName] presses a claim to the throne by force of arms."
 ftr_court_succession_war_victory_desc:0 "[attacker.GetFullName] seizes the throne and casts [defender.GetFullName] into captivity."
 ftr_court_succession_war_defeat_desc:0 "[attacker.GetFullName]'s bid for the throne lies in ruins."
 ftr_court_succession_war_white_peace_desc:0 "Neither side could press its claim, and the succession remains unsettled."
 ftr_court_succession_war_invalidated_desc:0 "The war of succession has come to an inconclusive end."

 ###### Interactions ######
 ftr_court_back_claimant_interaction:0 "<FTR>Declare Support"
 ftr_court_back_claimant_interaction_desc:0 "Back this magnate (or the liege's child / heir). An open declaration breeds rival resentment and may alert the monarch; secret support stays hidden."
 ftr_back_claimant_options_tt:0 "How to Support"
 ftr_court_back_claimant_alert_tt:0 "An open declaration has a small chance of stirring the monarch's suspicion"
 ftr_court_withdraw_backing_interaction:0 "<FTR>Withdraw Support"
 ftr_court_withdraw_backing_interaction_desc:0 "Step back into neutrality. Few forgive a withdrawn hand."
 ftr_court_assist_monarch_interaction:0 "<FTR>Steadfast Service"
 ftr_court_assist_monarch_interaction_desc:0 "Tend to the affairs of state so that power does not slip from the Crown's grasp."
 ftr_court_assist_monarch_interaction_notification:0 "[actor.GetFirstNameNoTooltip] has offered to serve you in your regency."
 ftr_court_assist_monarch_interaction_greeting:0 "I come to serve, my liege. Let me ease the burden of your co-rule."
 ftr_court_petition_coregency_interaction:0 "<FTR>Petition for Co-Rule"
 ftr_court_petition_coregency_interaction_desc:0 "Ask that the burdens of the Crown be shared — for now."
 ftr_court_promise_interaction:0 "<FTR>Make a Promise"
 ftr_court_promise_interaction_desc:0 "Swear a reward to this ally once you hold the reins — a council seat, or lighter obligations."
 ftr_court_promise_council_option:0 "Promise a Council Seat"
 ftr_court_promise_contract_option:0 "Promise Lighter Obligations"
 ftr_court_promise_gold_option:0 "Press Gold Into Their Hand"
 ftr_court_promise_favor_option:0 "Spend Prestige or Influence on Favour"

