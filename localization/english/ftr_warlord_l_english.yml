l_english:

 # ===== 军阀朝贡契约 =====
 ftr_tributary_warlord:0 "Warlord Tributary"
 ftr_tributary_warlord_desc:0 "A Warlord [tributary|E] has broken away from their former [liege|E] and rules their land as an independent warlord in all but name. They pay [gold|E] tribute to their former master and are shown in his colors, but owe him nothing else.\n\n$tributary_common_desc$"
 ftr_become_warlord_tt:0 "Becomes a Warlord [tributary|E]"

 # ===== 割据决议 =====
 ftr_warlord_secede_decision:0 "<FTR> Carve Out A Domain"
 ftr_warlord_secede_decision_tooltip:0 "With Our Lord Bled White By Endless Civil War, Why Should We Still Kneel?"
 ftr_warlord_secede_decision_desc:0 "Our lord is bogged down in a civil war that has dragged on for years without a decisive outcome, and his grip on the realm weakens by the day. Rather than wait for the storm to reach us, we should seize the moment and rule our own land — acknowledging him in name only."
 ftr_warlord_secede_decision_confirm:0 "The Time Has Come!"
 ftr_warlord_not_already_tt:0 "Has not carved out a domain yet"
 ftr_warlord_liege_prolonged_civil_war_tt:0 "Our lord has been mired in civil war for over five years and has yet to gain the upper hand"
 ftr_warlord_needs_real_land_tt:0 "We hold real land of our own — a mere noble house title is not enough"
 ftr_warlord_secede_decision_effect_tt:0 "A hidden roll of our [diplomacy|E] and [intrigue|E] against our [liege|E]'s decides whether the secession succeeds"
 ftr_warlord_secede_success_tt:0 "Secession Succeeded"
 ftr_warlord_secede_failure_tt:0 "Secession Failed, The Plot Is Exposed"
 ftr_warlord_secede_liege_title:0 "A Warlord Has Risen"
 ftr_warlord_secede_liege_desc:0 "[warlord_vassal.GetShortUIName] has taken advantage of our troubles, broken away from our realm and now rules as a warlord — offering us nothing but empty words of submission."
 ftr_warlord_refusal_war_tt:0 "The warlord's refusal to submit is a casus belli: you may march on him at once"

 # ===== 请求军事介入 =====
 ftr_request_military_intervention_interaction:0 "<FTR> Request Military Intervention"
 ftr_request_military_intervention_interaction_desc:0 "Ask a neighbouring realm to intervene in our war on our side. A [tributary|E] — a warlord included — may call upon their [suzerain|E] regardless of distance."
 ftr_request_military_intervention_interaction_text:0 "A neighbour is asking us to intervene in their war"
 ftr_request_military_intervention_interaction.accept.tt:0 "They Have Answered Our Call"
 ftr_request_military_intervention_interaction.decline.tt:0 "They Have Refused To Intervene"
 ftr_military_intervention_cost_tt:0 "Price Of Intervention"
 ftr_mi_pay_gold_tt:0 "Pay three years of their income"
 ftr_mi_pay_gold_desc_tt:0 "One year is paid up front as a deposit; the other two are settled once the war is won"
 ftr_mi_cede_county_tt:0 "Cede a neighbouring county to them"
 ftr_mi_cede_county_valid_tt:0 "Holds a county bordering their realm"
 ftr_mi_convert_faith_tt:0 "Convert to their faith and rite"
 ftr_mi_must_be_war_leader_tt:0 "We must be a war leader in this war"
 ftr_mi_already_contracted_tt:0 "They are not already under contract"
 ftr_mi_recipient_already_in_war_tt:0 "They are already taking part in this war"
 ftr_mi_remainder_paid_tt:0 "Military intervention: paying the remainder"
 ftr_mi_contribution_short_tt:0 "Military intervention: they contributed too little, so the remainder is not paid"
