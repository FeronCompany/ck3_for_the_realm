l_english:
 ftr_personal_merit_opinion:0 "Personal Merit"
 ftr_personal_merit_reward_gold_interaction_desc:0 "<FTR>Reward their merit with gold. This will consume an equivalent amount of their personal merit."
 ftr_personal_merit_reward_small_option:0 "<FTR>Bestow a small purse (150 gold, consumes 10 merit)"
 ftr_personal_merit_reward_large_option:0 "<FTR>Bestow a large purse (400 gold, consumes 30 merit)"
 ftr_personal_merit_request_gold_interaction_desc:0 "<FTR>Call upon your liege's personal merit in you and request gold as reward."
 ftr_personal_merit_request_small_option:0 "<FTR>Request a small purse (150 gold, consumes 10 merit)"
 ftr_personal_merit_request_large_option:0 "<FTR>Request a large purse (400 gold, consumes 30 merit)"
 ftr_personal_merit_request_council_interaction_desc:0 "<FTR>Request a council post in exchange for your merit. The seat may not be removed for 5 years."
 ftr_personal_merit.0001.t:0 "<FTR>A Meritorious Retainer"
 ftr_personal_merit.0001.desc:0 "<FTR>One of your courtiers has served you well. Time to weigh their merit and grant fitting reward."
 ftr_personal_merit.0001.a:0 "<FTR>Bestow gold (400 gold, consumes 30 merit)"
 ftr_personal_merit.0001.b:0 "<FTR>Grant a non-capital county (consumes 10 merit)"
 ftr_personal_merit.0001.c:0 "<FTR>Grant them a council post (consumes 40 merit)"
 ftr_personal_merit.0001.d:0 "<FTR>Defer this for now"
 ftr_court_persuade_backing_interaction_desc:0 "<FTR>Urge a peer to openly back the candidate you support. Both of you will gain merit in their eyes."
