l_english:

 ###### 0001 潜伏 ######
 ftr_court_struggle.0001.t:0 "Murmurs in the Hall"
 ftr_court_struggle.0001.desc:0 "Servants whisper that [ftr_court_candidate.GetFullName] has been receiving visitors at all hours — men of consequence, men with purses. Nothing that can be proven. Nothing yet."
 ftr_court_struggle.0001.a:0 "It is beneath my notice."
 ftr_court_struggle.0001.b:0 "Summon them, and make my displeasure plain."
 ftr_court_struggle.0001.c:0 "Let them have their little court. I shall watch."

 ###### 0003 对立 ######
 ftr_court_struggle.0003.t:0 "Two Suns in One Sky"
 ftr_court_struggle.0003.desc:0 "The court has begun to divide. Every appointment is now read as a signal, every slight as a declaration. The contenders watch each other — and watch me."
 ftr_court_struggle.0003.a:0 "Let them wear themselves out."
 ftr_court_struggle.0003.b:0 "I will favour the strongest."
 ftr_court_struggle.0003.c:0 "Enough. I forbid this infighting."

 ###### 0005 危机 ######
 ftr_court_struggle.0005.t:0 "The Edge of the Knife"
 ftr_court_struggle.0005.desc:0 "It has gone beyond whispers. Messengers move between the great houses, and more than one of them carries a seal that is not mine. If I do not act, someone else will."
 ftr_court_struggle.0005.a:0 "The succession will resolve itself."
 ftr_court_struggle.0005.b:0 "I must name my successor — now."
 ftr_court_struggle.0005.c:0 "Find the ringleader and break them."

 ###### 0010 老君王的命运 ######
 ftr_court_struggle.0010.t:0 "The Deposed"
 ftr_court_struggle.0010.desc:0 "[ftr_court_old_monarch.GetFullName] sits where I once knelt. The realm holds its breath to see what I shall do with a fallen crown."
 ftr_court_struggle.0010.a:0 "House arrest. They live."
 ftr_court_struggle.0010.b:0 "The dungeon. Let them feel the weight of it."
 ftr_court_struggle.0010.c:0 "A fallen crown has no use for a head."

 ###### 0011 其余竞争者 ######
 ftr_court_struggle.0011.t:0 "The Other Heirs"
 ftr_court_struggle.0011.desc:0 "There are others who bore the same blood and the same hope. Some bent the knee quickly. Some did not bend at all."
 ftr_court_struggle.0011.a:0 "Pardon them, and honour what I promised."
 ftr_court_struggle.0011.b:0 "Strike the loudest voice — seize the greatest threat."
 ftr_court_struggle.0011.c:0 "Let them keep their lands. I will watch them."

 ###### 0012 竞争者的抉择 ######
 ftr_court_struggle.0012.t:0 "Bend, or Break"
 ftr_court_struggle.0012.desc:0 "[ftr_court_new_monarch.GetFullName] wears a crown that by rights could have been mine. My levies are still mine to call. The question is whether I dare."
 ftr_court_struggle.0012.a:0 "Never. I press my claim by force."
 ftr_court_struggle.0012.b:0 "I swallow my pride and bend the knee."

 ###### 0013 处置叛乱者 ######
 ftr_court_struggle.0013.t:0 "The Rebel in Chains"
 ftr_court_struggle.0013.desc:0 "[ftr_court_warleader.GetFullName] gambled for my crown and lost. The claim is struck from the succession, the banners are broken, and the rebel now kneels in my dungeon. What remains is to decide what their loyalty was worth."
 ftr_court_struggle.0013.a:0 "Let them rot in the dungeon."
 ftr_court_struggle.0013.b:0 "Cast them out of the realm."
 ftr_court_struggle.0013.c:0 "An example must be made."
 ftr_court_struggle.0013.d:0 "They have lost enough already."

 ###### 0016 内阁承诺首次提醒 ######
 ftr_court_struggle.0016.t:0 "A Seat Owed"
 ftr_court_struggle.0016.desc:0 "The crown has settled upon [ROOT.GetTitledFirstNamePossessive] head, and with it the ledger of promises made on the road to power. [ftr_court_promised_vassal.GetFullName] supported this claim in exchange for a seat upon the council. The court is watching whether such words mean anything."
 ftr_court_struggle.0016.a:0 "A promise is a promise. Grant the seat."
 ftr_court_struggle.0016.b:0 "The time is not right. Postpone it."

 ###### 0017 内阁承诺终裁 ######
 ftr_court_struggle.0017.t:0 "The Patience Runs Out"
 ftr_court_struggle.0017.desc:0 "[ftr_court_promised_vassal.GetFullName] has waited long enough. Months have passed since the promise of a council seat, and no position has materialised. Today they demand an answer — and the court watches with them."
 ftr_court_struggle.0017.a:0 "Enough. Grant the seat."
 ftr_court_struggle.0017.b:0 "The throne owes nothing. Refused."

 ###### 0018 废黜昏君 ######
 ftr_court_struggle.0018.t:0 "The Strings Are Mine"
 ftr_court_struggle.0018.desc:0 "The [ftr_court_monarch.GetTitledFirstName] signs whatever is placed before them, and every decree of late bears my fingerprints. The court bows to me while kneel formally to them. It would take so little — and no one would mourn."
 ftr_court_struggle.0018.a:0 "Why should the strings not come with a throne?"
 ftr_court_struggle.0018.b:0 "The strings are enough — for now."

 ###### 0019 朝堂权力角逐开始 ######
 ftr_court_struggle.0019.t:0 "The Contest for the Throne Begins"
 ftr_court_struggle.0019.desc:0 "The question of succession has been answered — no, not answered, but thrown open. Around [ftr_court_monarch.GetTitledFirstName], claimants circle and councillors choose sides. The struggle for the Crown has begun, and every man and woman of power must now decide where their allegiance lies."
 ftr_court_struggle.0019.a:0 "I will watch the tide of power closely."

###### 0021 The court struggle ends ######
 ftr_court_struggle.0021.t:0 "The Dust Settles"
 ftr_court_struggle.0021.desc:0 "The struggle for power around [ftr_court_monarch.GetTitledFirstName] has come to an end. The quarrelling voices of the court fall silent and the undercurrents fade. Some have gained what they sought, others have stepped away in defeat, and many simply breathe a sigh of relief — the contest is over at last."
 ftr_court_struggle.0021.a:0 "At last, calm returns."

 ###### 0014 朝堂站队 ######
 ftr_court_struggle.0014.t:0 "Choosing Sides"
 ftr_court_struggle.0014.desc:0 "The court is quietly splitting into camps, and neutrality is becoming the most dangerous position of all. It is time to decide whose star to follow."
 ftr_court_struggle.0014.a:0 "Back [ftr_court_claimant_1.GetFullName]"
 ftr_court_struggle.0014.b:0 "Back [ftr_court_claimant_2.GetFullName]"
 ftr_court_struggle.0014.c:0 "Back [ftr_court_claimant_3.GetFullName]"
 ftr_court_struggle.0014.d:0 "Back [ftr_court_claimant_4.GetFullName]"
 ftr_court_struggle.0014.e:0 "Back [ftr_court_claimant_5.GetFullName]"
 ftr_court_struggle.0014.f:0 "Watch and wait."
 ftr_court_apply_backing_effect.liege_notify_text:0 "This may lead to alert and anger of top liege"

 ###### 0015 竞争者抉择 ######
 ftr_court_struggle.0015.t:0 "The Time Is Now"
 ftr_court_struggle.0015.desc:0 "Supporters have gathered, grievances have been aired, and the old [ftr_court_monarch.GetTitledFirstName] weakens by the day. Men look to me for a signal. Hesitate now, and they will look elsewhere."
 ftr_court_struggle.0015.a:0 "Raise the banners."
 ftr_court_struggle.0015.b:0 "Strike from the shadows."
 ftr_court_struggle.0015.c:0 "Bide my time a while longer."

 ###### 0020 共治请愿 ######
 ftr_court_struggle.0020.t:0 "A Request to Share the Burden"
 ftr_court_struggle.0020.desc:0 "[actor.GetFullName] kneels with all due humility, and asks — in the most courteous of terms — that the burdens of rule be shared. The phrasing is flawless. That is what makes it dangerous."
 ftr_court_struggle.0020.a:0 "Very well. Share the burden."
 ftr_court_struggle.0020.b:0 "The Crown does not share. Refused."

 ###### 0040 是否参与继位角逐 ######
 ftr_court_struggle.0040.t:0 "To Enter the Contest"
 ftr_court_struggle.0040.desc:0 "[ftr_court_monarch.GetTitledFirstName] grows old, and the question of the throne has been thrown open. Should [ROOT.GetFullName] stake a claim and enter the contest, or stand aside and let others fight it out?"
 ftr_court_struggle.0040.a:0 "I will enter the contest for the throne."
 ftr_court_struggle.0040.b:0 "I want no part in this contest."

 ###### 0041 君主警觉 ######
 ftr_court_struggle.0041.t:0 "A Whisper of Disloyalty"
 ftr_court_struggle.0041.desc:0 "Word reaches [ftr_court_monarch.GetTitledFirstName] that a subject has openly thrown their weight behind another in the court. Whose loyalty can truly be trusted when the throne is at stake?"
 ftr_court_struggle.0041.a:0 "I will watch [ftr_court_supported.GetFullName] closely."
 ftr_court_struggle.0041.b:0 "It means little enough."

###### 0050-0056 Slander-and-poison chain (§12.4.2 means 2.1)######
 ftr_court_struggle.0050.t:0 "A Rumour Sharp as a Blade"
 ftr_court_struggle.0050.desc:0 "The struggle over the throne has turned to shadows. [ROOT.GetTitledFirstName] decides to strike first, sending trusted agents to spread tales of embezzlement and disloyalty about [scope:ftr_court_victim.GetFullName] throughout the court."
 ftr_court_struggle.0050.a:0 "Spread the rumour and tarnish their name."
 ftr_court_struggle.0050.b:0 "The stakes are too high — hold my tongue."
 ftr_court_struggle.0051.t:0 "Forged Evidence"
 ftr_court_struggle.0051.desc:0 "[ROOT.GetTitledFirstName] has forged irrefutable 'proof' of [scope:ftr_court_victim.GetFullName]'s embezzlement, and lays it before the throne. Should the sovereign believe it, [scope:ftr_court_victim.GetFullName]'s name will be ruined."
 ftr_court_struggle.0051.a:0 "Present the forgery against [scope:ftr_court_victim.GetFullName]."
 ftr_court_struggle.0051.b:0 "Heaven would not abide it — I withdraw."
 ftr_court_struggle.0052.t:0 "Poison in the Cup"
 ftr_court_struggle.0052.desc:0 "A step in the dark. [ROOT.GetTitledFirstName] has acquired a lethal poison. In a single breath one could end [scope:ftr_court_victim.GetFullName]'s bid for the throne — or their life."
 ftr_court_struggle.0052.a:0 "Slip them the killing dose."
 ftr_court_struggle.0052.b:0 "Administer a slow poison that leaves them bedridden."
 ftr_court_struggle.0052.c:0 "I cannot bring myself to do it."
 ftr_court_struggle.0053.t:0 "Word Leaks Out"
 ftr_court_struggle.0053.desc:0 "[ROOT.GetTitledFirstName] learns that [scope:ftr_court_actor.GetFullName] has been spreading slander against them at court. Without a riposte, their standing will collapse."
 ftr_court_struggle.0053.a:0 "Fight fire with fire."
 ftr_court_struggle.0053.b:0 "A clear conscience needs no defence — bear it."
 ftr_court_struggle.0054.t:0 "The Charge of Corruption"
 ftr_court_struggle.0054.desc:0 "[ROOT.GetTitledFirstName] stands accused of embezzlement. The evidence is forged, yet it rests squarely before [ftr_court_arbiter.GetTitledFirstName] — unless one can plead innocence convincingly."
 ftr_court_struggle.0054.a:0 "Protest my innocence at length."
 ftr_court_struggle.0054.b:0 "Say nothing and weather the scandal."
 ftr_court_struggle.0055.t:0 "The Poison Takes Hold"
 ftr_court_struggle.0055.desc:0 "A searing pain tears through [ROOT.GetTitledFirstName]'s gut. Poisoned — but by which rival at court?"
 ftr_court_struggle.0055.a:0 "Summon the physicians!"
 ftr_court_struggle.0056.t:0 "Waxing Weak"
 ftr_court_struggle.0056.desc:0 "[ROOT.GetTitledFirstName] has lately felt dizzy and listless. Something slow in the food seems to be sapping their strength day by day."
 ftr_court_struggle.0056.a:0 "I must investigate the household stores."
 ftr_court_struggle.0057.t:0 "The Rumour War Escalates"
 ftr_court_struggle.0057.desc:0 "Rumours spread like wildfire. [ROOT.GetTitledFirstName] and [ftr_court_actor.GetTitledFirstName] trade ever harsher slanders while the whole court watches. Escalate until both are dragged down, or step back?"
 ftr_court_struggle.0057.a:0 "Fight fire with fire."
 ftr_court_struggle.0057.b:0 "Lower the swords and keep low."
 ftr_court_struggle.0058.t:0 "The Forger Is Unmasked"
 ftr_court_struggle.0058.desc:0 "Close inquiry reveals the evidence was forged by [ftr_court_inq_actor.GetTitledFirstName] — [ftr_court_inq_victim.GetTitledFirstName] stands vindicated. How should the slanderer be dealt with?"
 ftr_court_struggle.0058.a:0 "Imprison the forger as a warning."
 ftr_court_struggle.0058.b:0 "Reprimand them publicly."
 ftr_court_struggle.0058.c:0 "Let it go — vengeance begets vengeance."
 ftr_court_struggle.0059.t:0 "Hunt the Poisoner"
 ftr_court_struggle.0059.desc:0 "After the poisoning, [ROOT.GetTitledFirstName] turns it over — the cup, the strange dish, all point toward [ftr_court_actor.GetTitledFirstName]. Keep pressing the matter, or swallow the insult?"
 ftr_court_struggle.0059.a:0 "I will not rest until this is settled!"
 ftr_court_struggle.0059.b:0 "Without proof, I can only bear it."

###### 0060 Spymaster's eye / 0090 Murder (means 2.2 / 2.5)######
 ftr_court_struggle.0060.t:0 "The Spymaster's Eye"
 ftr_court_struggle.0060.desc:0 "As the intrigues at court grow ever hotter, [ROOT.GetTitledFirstName] resolves to send one's ablest agents to investigate the most prominent claimant and see what leverage might be found against them."
 ftr_court_struggle.0060.a:0 "Investigate and expose their misdeeds openly."
 ftr_court_struggle.0060.b:0 "Know the enemy, but bide my time."
 ftr_court_struggle.0090.t:0 "The Assassin's Plot"
 ftr_court_struggle.0090.desc:0 "[ROOT.GetTitledFirstName]'s contest for the throne with [scope:ftr_court_victim.GetFullName] has become mortal. Rather than fall honourably, [ROOT.GetTitledFirstName] muses on hiring cutthroats to make the rival no longer a concern."
 ftr_court_struggle.0090.a:0 "Hire assassins to end their life."
 ftr_court_struggle.0090.b:0 "Fall back on finding some leverage instead."
 ftr_court_struggle.0090.c:0 "The blade cuts both ways — I will not."

###### 0070 Leverage / 0080 Abduction (means 2.3 / 2.4)######
 ftr_court_struggle.0070.t:0 "A Secret in Hand"
 ftr_court_struggle.0070.desc:0 "Years of building connections now bear fruit: a trusted agent has uncovered something [scope:ftr_court_victim.GetFullName] would sooner keep hidden. Use it to extort quietly, or expose it to shame them openly?"
 ftr_court_struggle.0070.a:0 "Seize the leverage and extort in private."
 ftr_court_struggle.0070.b:0 "Expose it openly and humble them."
 ftr_court_struggle.0080.t:0 "Taken in the Night"
 ftr_court_struggle.0080.desc:0 "The contest can no longer be won by courtly manoeuvre alone. [ROOT.GetTitledFirstName] hires a band of cutthroats to seize [scope:ftr_court_victim.GetFullName] by night, so the rival may feel a blade at their throat."
 ftr_court_struggle.0080.a:0 "Seize them and force a concession."
 ftr_court_struggle.0080.b:0 "Frighten them and let them go."
 ftr_court_struggle.0080.c:0 "Abduction offends heaven — I desist."
 ftr_court_struggle.0071.t:0 "Leverage Bites"
 ftr_court_struggle.0071.desc:0 "The secret in [ROOT.GetTitledFirstName]'s hand cuts like a blade — [ftr_court_leverage_holder_victim.GetTitledFirstName]'s fate hangs on your whim. Press for gain, or burn the bridges openly?"
 ftr_court_struggle.0071.a:0 "Press them into yielding for real gain."
 ftr_court_struggle.0071.b:0 "Expose them and ruin their name."
 ftr_court_struggle.0071.c:0 "Return the secret for goodwill."
 ftr_court_struggle.0072.t:0 "Bitten Back"
 ftr_court_struggle.0072.desc:0 "[ftr_court_leverage_holder_victim.GetTitledFirstName] is no easy prey — the leverage you thought secure was turned against you before the whole court."
 ftr_court_struggle.0072.a:0 "A formidable opponent... I must swallow this."
 ftr_court_struggle.0081.t:0 "A Knife at the Throat"
 ftr_court_struggle.0081.desc:0 "After a night of terror, [ROOT.GetTitledFirstName] at last sees who holds the knife — [ftr_court_actor.GetTitledFirstName]. Yield and withdraw, defy them unto death, or plot a return blow?"
 ftr_court_struggle.0081.a:0 "Better to live — yield and step back."
 ftr_court_struggle.0081.b:0 "Death before dishonour!"
 ftr_court_struggle.0081.c:0 "This insult will be repaid a hundredfold."
 ftr_court_struggle.0082.t:0 "The Counterstroke Lands"
 ftr_court_struggle.0082.desc:0 "[ftr_court_victim.GetTitledFirstName]'s revenge is swift and sharp — your abduction has been exposed, and the court looks on with contempt."
 ftr_court_struggle.0082.a:0 "One misstep after another..."
 ftr_court_struggle.00A1.t:0 "Whispers in the Dark"
 ftr_court_struggle.00A1.desc:0 "The co-ruler's power swells, and [ROOT.GetTitledFirstName], holding no land, must work in shadow — sounding out courtiers who resent the co-ruler and poisoning the monarch's ear."
 ftr_court_struggle.00A1.a:0 "Spread whispers to weaken the co-ruler."
 ftr_court_struggle.00A1.b:0 "Buy off the co-ruler's circle and plot slowly."
 ftr_court_struggle.00A1.c:0 "The hour is not ripe — endure for now."
 ftr_court_struggle.00A2.t:0 "The Co-Ruler Strikes Back"
 ftr_court_struggle.00A2.desc:0 "The loyalists press hard, and [ROOT.GetTitledFirstName]'s position as co-ruler hangs by a thread. Order trusted allies to lobby at court, or lie low?"
 ftr_court_struggle.00A2.a:0 "Dispatch allies to win back hearts."
 ftr_court_struggle.00A2.b:0 "Bide my time for a better day."

###### 0999 DEBUG list claimants (ftr_court_debug_report_claimants_decision) ######
 ftr_court_struggle.0999.t:0 "[DEBUG] Court Claimants Overview"
 ftr_court_struggle.0999.desc:0 "List each current claimant and their number of supporters. Hover over the option below to view the list."
 ftr_court_struggle.0999.a:0 "View List"
 ftr_court_struggle.0999.b:0 "Close"


