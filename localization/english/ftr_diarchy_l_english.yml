l_english:
 # ===== Interactions (design 2 / 4) =====
 ftr_diarchy_designate_heir_no_diarchy_tt:0 "<FTR>You cannot designate an heir while a co-ruler (regent / co-emperor / crown prince) sits beside you — depose them first"
 ftr_diarch_designate_heir_interaction:0 "<FTR>Designate Heir for Your Liege"
 ftr_diarch_designate_heir_interaction_desc:0 "<FTR>Reach past your liege and name his heir yourself. The crown prince you choose will answer to you."
 ftr_diarch_designate_heir_interaction_notification:0 "<FTR>You have designated your liege's heir"
 ftr_diarch_boost_succession_interaction:0 "<FTR>Cultivate a Successor"
 ftr_diarch_boost_succession_interaction_desc:0 "<FTR>Pave the way for your own heir: once you leave the co-rule, he will take your place as co-ruler."
 ftr_diarch_boost_succession_interaction_notification:0 "<FTR>Your successor is prepared"
 ftr_diarch_boost_succession_effect_tt:0 "<FTR>You have paved his way: once you leave the co-rule, he will take your place"
 ftr_diarch_levy_vassal_interaction:0 "<FTR>Levy a Vassal"
 ftr_diarch_levy_vassal_interaction_desc:0 "<FTR>Buy a vassal's sword with gold, a favour, or influence, and drag him into your war."
 ftr_diarchy_levy_options_tt:0 "<FTR>You may offer several at once — the more you give, the likelier he agrees"
 ftr_diarchy_levy_gold_tt:0 "<FTR>Gold: #P +20#! acceptance"
 ftr_diarchy_levy_hook_tt:0 "<FTR>Spend a favour: #P +10#! acceptance"
 ftr_diarchy_levy_influence_tt:0 "<FTR>Administrative influence: #P +20#! acceptance"

 # ===== Decisions (design 3 / 4) =====
 ftr_diarchy_abolish_crown_prince_decision:0 "<FTR>Abolish the Crown Prince"
 ftr_diarchy_abolish_crown_prince_decision_desc:0 "<FTR>Strip the crown prince of his title and inheritance, end the co-rule, and reduce him to an ordinary vassal. He and the court will not forgive you."
 ftr_diarchy_abolish_crown_prince_decision_tooltip:0 "<FTR>Depose the crown prince and disinherit him"
 ftr_diarchy_depose_liege_decision:0 "<FTR>Depose Your Liege"
 ftr_diarchy_depose_liege_decision_desc:0 "<FTR>Force your liege from the throne: he loses every title and is thrown in chains, his designated heir takes his place, and you take the credit from the shadows."
 ftr_diarchy_depose_liege_decision_tooltip:0 "<FTR>Force your liege to abdicate in favour of his heir"
 ftr_diarchy_prepare_coup_decision:0 "<FTR>Prepare a Coup"
 ftr_diarchy_prepare_coup_decision_desc:0 "<FTR>Show your hand to the realm's vassals: kneel to you, or take up arms for their sovereign. This is done openly — your liege will see it."
 ftr_diarchy_prepare_coup_decision_tooltip:0 "<FTR>Announce your intent and force the vassals to choose"
 ftr_diarchy_prepare_coup_supporters_tt:0 "<FTR>Requires the backing of at least 2 landed vassals"
 ftr_diarchy_coup_landing_decision:0 "<FTR>Seize the Throne"
 ftr_diarchy_coup_landing_decision_desc:0 "<FTR>The moment has come: depose your liege, take every title he holds, and keep him in chains under your watch."
 ftr_diarchy_coup_landing_decision_tooltip:0 "<FTR>Usurp your liege's throne"
 ftr_diarchy_coup_landing_unlocked_tt:0 "<FTR>No serious opposition remains, or the moment to strike has arrived"
 ftr_diarchy_amnesty_decision:0 "<FTR>Amnesty for All"
 ftr_diarchy_amnesty_decision_desc:0 "<FTR>Proclaim a general amnesty in your liege's name: pardon the crimes of all his direct vassals, throw open both his dungeons and your own, and wash away the strife you have accumulated as co-ruler, at the cost of his legitimacy and goodwill."
 ftr_diarchy_amnesty_decision_tooltip:0 "<FTR>Reduce your strife, pardon your liege's direct vassals, and free every prisoner in both your dungeons"
 ftr_diarchy_amnesty_pardon_tt:0 "<FTR>All direct vassals of your liege: their crimes are marked #P already punished#! (no longer grounds for imprisonment / banishment / execution / title revocation)"
 ftr_diarchy_amnesty_release_tt:0 "<FTR>The cells are opened: #P every prisoner#! in your liege's dungeons and in your own will walk free — and they will remember who freed them"
 ftr_diarchy.0300.t:0 "<FTR>The Amnesty"
 ftr_diarchy.0300.desc:0 "<FTR>You are free again, thanks to a single proclamation from the co-ruler who holds half the realm in his hand. He makes his expectation plain: in his struggle with your sovereign, he wants you at his side."
 ftr_diarchy.0300.a:0 "<FTR>Back him (and earn the merit)"
 ftr_diarchy.0300.b:0 "<FTR>Politely decline"

 # ===== Events (design 4) =====
 ftr_diarchy.0010.t:0 "<FTR>The Ambitious Co-Ruler"
 ftr_diarchy.0010.desc:0 "<FTR>Your co-ruler has begun openly courting the court, spreading whispers and promises of office. He no longer hides his intent: he wants your seat."
 ftr_diarchy.0010.a:0 "<FTR>I will remember this"
 ftr_diarchy.0020.t:0 "<FTR>A Choice Forced on You"
 ftr_diarchy.0020.desc:0 "<FTR>Your liege's co-ruler sends word: the court must choose. Bow to him, or take up arms to \"cleanse the sovereign's side\"."
 ftr_diarchy.0020.a:0 "<FTR>Bow to him (do not oppose)"
 ftr_diarchy.0020.b:0 "<FTR>Rise in the name of cleansing the sovereign's side"
 ftr_diarchy.0020.c:0 "<FTR>Wait and see"
 ftr_diarchy.0100.t:0 "<FTR>The Fallen Sovereign"
 ftr_diarchy.0100.desc:0 "<FTR>The sovereign of yesterday is a prisoner today. He once commanded from the high hall; now his life rests in your hands."
 ftr_diarchy.0100.a:0 "<FTR>House arrest for life"
 ftr_diarchy.0100.b:0 "<FTR>Exile him"
 ftr_diarchy.0100.c:0 "<FTR>Execute him"
 ftr_diarchy.0200.t:0 "<FTR>The Co-Ruler Wants Land"
 ftr_diarchy.0200.desc:0 "<FTR>Your co-ruler still holds no land of his own. Once again he hints that a co-ruler ought to have domains — and vassals of his own."
 ftr_diarchy.0200.a:0 "<FTR>Carve out a domain for him"
 ftr_diarchy.0200.b:0 "<FTR>Not now"
 ftr_diarchy.0200.c:0 "<FTR>He swears to serve you faithfully"

 # ===== Qingjunce CB (design 5) =====
 ftr_qingjunce:0 "<FTR>Cleanse the Sovereign's Side"
 ftr_qingjunce_desc:0 "<FTR>Take up arms to rid your sovereign of the co-ruler who clings to his side — and take that place yourself."
 ftr_qingjunce_declared_tt:0 "<FTR>The banners of the cleansing are raised"
 ftr_qingjunce_victory_desc:0 "<FTR>Your banners have broken the co-ruler's grip. You shall be your sovereign's new regent."
 ftr_qingjunce_defeat_desc:0 "<FTR>Your rebellion has failed. You will spend the rest of your days in a cell."
 ftr_qingjunce_invalidated_desc:0 "<FTR>The situation has changed; this war has lost its meaning."
